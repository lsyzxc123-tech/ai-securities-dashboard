<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c111d">
<title>AI 증권사 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0c111d; --panel:#131a2a; --panel2:#182137; --line:#232d46;
  --text:#e7ebf5; --muted:#8c96ae; --faint:#5f6985; --accent:#88aaff;
  --up:#4fd18b; --down:#ff6b6b; --warn:#f3c04f;
  --c-earnings-ai:#6f8cff; --c-chart-ai:#b6c0d8; --c-swing-lab:#f0b35a; --c-analyst-desk:#52c7a3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 48px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--muted)} .faint{color:var(--faint)}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* 잠금 화면 */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate form{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.gate h1{font-size:22px;margin:0 0 6px;font-weight:700}
.gate p{margin:0 0 20px;color:var(--muted);font-size:14px}
.gate input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.gate label{display:flex;gap:8px;align-items:center;margin:12px 0 18px;color:var(--muted);font-size:14px}
.gate .btn{width:100%;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#0c111d;font-weight:700;cursor:pointer}
.gate .err{color:var(--down);font-size:14px;min-height:20px;margin-top:10px}

/* 머리 */
header.top{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
header.top .meta{color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.refresh{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
.refresh:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted);margin:-8px 0 14px;min-height:0}
.status:empty{display:none}.status.err{color:var(--down)}.status.ok{color:var(--up)}

/* 히어로 */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin-bottom:16px}
.hero .row{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero .label{color:var(--muted);font-size:14px}
.hero .big{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 4px}
.hero .sub{color:var(--muted);font-size:13px}
.hero .absret{font-size:14px;margin-top:8px}
.hero .absret b{font-weight:650;margin-right:10px}
.hero .side{display:grid;gap:10px;min-width:240px}
.hero .side div{display:flex;justify-content:space-between;gap:18px;font-size:14px}
.hero .side b{font-weight:600}
.trust{margin-top:18px}
.trust .cap{font-size:13px;color:var(--muted);margin-bottom:8px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2);gap:2px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* 패널 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.panel h2{font-size:15px;font-weight:650;color:var(--accent);margin:0 0 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{color:var(--muted);font-weight:400;font-size:13px}
.grid3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px;margin-bottom:16px}
.grid3 .panel{margin:0}
.grid-field{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid3>*,.grid-field>*{min-width:0}
.inner{background:var(--panel2);border-radius:10px;padding:12px 14px}
.inner + .inner{margin-top:10px}
.inner h3{font-size:14px;margin:0 0 6px;font-weight:650}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* 표 */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--faint);font-weight:500;font-size:12.5px;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:0}
tr:last-child td{border-bottom:0}
td .name{font-weight:600}
td .desc{display:block;color:var(--muted);font-size:12.5px;white-space:normal;max-width:280px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);margin-left:6px}
.chip.inc{color:var(--up);background:rgba(79,209,139,.1)}
.chip.sh{color:var(--warn);background:rgba(243,192,79,.1)}
.chip.ret{color:var(--faint)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}

/* 목록 */
ul.memo{margin:0;padding-left:18px}
ul.memo li{margin:4px 0;font-size:14px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.dday{flex:0 0 auto;min-width:54px;text-align:center;font-size:13px;font-weight:700;padding:3px 0;border-radius:8px;background:rgba(136,170,255,.12);color:var(--accent);font-variant-numeric:tabular-nums}
.dday.soon{background:rgba(243,192,79,.14);color:var(--warn)}
.ev b{display:block;font-size:14px;font-weight:600}
.ev span{font-size:13px;color:var(--muted)}
.pick{display:grid;grid-template-columns:72px 64px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pick:last-child{border-bottom:0}
.pick .t{font-weight:700}
.pick .r{font-size:13.5px;color:var(--muted)}
.quota{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:6px 0 2px}
.quota span{display:block;height:100%;background:var(--accent)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:4px}
footer{color:var(--faint);font-size:12.5px;margin-top:24px;line-height:1.7}
.gstat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.gstat .inner b{display:block;font-size:18px;font-weight:700;margin-top:2px}
.gstat .inner .lbl{font-size:12.5px;color:var(--muted)}
.gstat .inner .sub2{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin:4px 0 0;padding:0;list-style:none}
.chips li{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.halt{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35);color:var(--down);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.okbadge{color:var(--up)} .nobadge{color:var(--down)}
.spark{width:100%;height:46px;display:block;margin-top:6px}
/* 보유 표: 표가 넘치면 표 안에서 옆으로 밀리고, 종목 칸은 왼쪽에 고정 */
.hold{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.hold th:first-child,.hold td:first-child{position:sticky;left:0;z-index:1;background:var(--panel2);min-width:76px;max-width:120px;box-shadow:6px 0 6px -6px rgba(0,0,0,.6)}
.hold td:first-child .desc{max-width:120px;white-space:normal}
.hold tr.total td{border-top:2px solid var(--line);font-weight:700}
.why{white-space:normal;font-size:13px;color:var(--muted);text-align:left;max-width:360px;min-width:190px}
@media (max-width:900px){.gstat{grid-template-columns:repeat(2,1fr)}}

@media (max-width:900px){
  .grid3,.grid-field{grid-template-columns:1fr !important}
}
@media (max-width:560px){
  .wrap{padding:14px 12px 40px}
  .hero{padding:18px 16px 16px}
  .hero .big{font-size:36px}
  .hero .side{min-width:0;width:100%}
  .panel{padding:16px 14px}
  .pick{grid-template-columns:60px 52px 1fr}
  td .desc.dd{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .bar span{transition:flex-basis .6s ease}
}
</style>
<style>/* ===== 폴더형 화면 (2026-11-23) — 기존 어두운 터미널 색을 그대로 쓴다 ===== */
.fx{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.fx-side{position:sticky;top:0;height:100vh;overflow-y:auto;background:#0a0f1a;border-right:1px solid var(--line);padding:16px 10px 24px}
.fx-side .brand{font-weight:700;font-size:16px;padding:2px 10px 12px;display:flex;justify-content:space-between;align-items:center}
.fx-side .brand small{color:var(--faint);font-weight:400;font-size:12px}
.tree{list-style:none;margin:0;padding:0}
.tree ul{list-style:none;margin:0;padding:0 0 0 18px}
.tree a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:14px}
.tree a:hover{background:var(--panel)}
.tree a.on{background:var(--panel2);color:var(--accent);font-weight:600}
.tree a .ic{width:20px;text-align:center;flex:0 0 auto}
.tree a .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree li.hid>a{opacity:.4}
.tree .ed{display:none;gap:2px}
.editing .tree .ed{display:flex}
.ed button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;font-size:12px;padding:1px 5px;cursor:pointer;line-height:1.4}
.ed button.on{color:var(--warn);border-color:var(--warn)}
.side-tools{display:flex;gap:6px;flex-wrap:wrap;padding:12px 10px 0;border-top:1px solid var(--line);margin-top:12px}
.side-tools button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.side-help{color:var(--faint);font-size:12px;padding:8px 10px 0;line-height:1.5;display:none}
.editing .side-help{display:block}
.nb{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--down);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:18px}
.nb.info{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.fx-main{min-width:0}
.fx-top{display:none}
.fx-tabs{display:none}
.fx-scrim{display:none}
.fhead{display:flex;justify-content:space-between;gap:10px 16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:14px}
.fhead h1{margin:0;font-size:20px;display:flex;gap:8px;align-items:center}
.fhead .upd{color:var(--muted);font-size:12.5px;text-align:right}
.upd b{color:var(--text);font-weight:600}
.alerts{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.alerts div{background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);color:#ffb4b4;border-radius:10px;padding:8px 12px;font-size:13.5px}
.alerts div.info{background:rgba(136,170,255,.07);border-color:rgba(136,170,255,.25);color:var(--muted)}
.kind{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:6px;border:1px solid;letter-spacing:.02em;vertical-align:2px}
.kind.k-shadow{color:#b9c4ff;border-color:rgba(136,170,255,.45);background:rgba(136,170,255,.08)}
.kind.k-bt{color:#f3c04f;border-color:rgba(243,192,79,.45);background:rgba(243,192,79,.08)}
.kind.k-paper{color:#7fd1e8;border-color:rgba(127,209,232,.45)}
.kind.k-live{color:#ff9f7a;border-color:rgba(255,159,122,.5)}
.kind.k-ops{color:var(--muted);border-color:var(--line)}
.wtog{background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;display:inline-flex;gap:6px;align-items:baseline;text-align:left}
.wtog .car{color:var(--faint);font-size:12px;display:inline-block;transition:transform .15s}
.wcol>:not(h2){display:none !important}
.wcol>h2{margin-bottom:0}
.wcol .car{transform:rotate(-90deg)}
.hero.wcol>.row,.hero.wcol>.trust{display:none}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpis .inner b{display:block;font-size:20px;font-weight:700;margin-top:2px}
.kpis .lbl{font-size:12.5px;color:var(--muted)}
.kpis .sub2{font-size:12.5px}
.btn2{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px;text-decoration:none;display:inline-block}
.btn2:hover{border-color:var(--accent)}
.btn2.pri{background:var(--accent);color:#0c111d;border-color:var(--accent);font-weight:700}
.slider{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin:0 0 12px;flex-wrap:wrap}
.slider input{flex:1;min-width:160px;accent-color:var(--accent)}
.slider b{color:var(--text)}

/* 트레이딩 플로어 (픽셀) */
.office{background:#0a0f1a;border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:16px 16px}
.desk{background:rgba(19,26,42,.85);border:2px solid var(--line);border-radius:4px;padding:8px 8px 6px;cursor:pointer;text-align:left;color:var(--text);font:inherit;position:relative;
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;image-rendering:pixelated}
.desk:hover,.desk.sel{border-color:var(--accent)}
.desk svg{width:100%;height:auto;display:block;shape-rendering:crispEdges}
.desk .who{font-size:12.5px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk .what{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.desk .st{position:absolute;top:6px;right:6px;font-size:11px;padding:0 6px;border-radius:3px;font-weight:700}
.st-work{background:rgba(79,209,139,.16);color:var(--up)}
.st-idle{background:rgba(140,150,174,.16);color:var(--muted)}
.st-veto{background:rgba(243,192,79,.18);color:var(--warn)}
.st-err{background:rgba(255,107,107,.18);color:var(--down)}
@media (prefers-reduced-motion:no-preference){
  .scr-work{animation:blink 1.6s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}
  .tape .run{animation:tape 60s linear infinite}
  .tape:hover .run{animation-play-state:paused}
  @keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
}
.legend2{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:8px 0 0}
.confbar{display:inline-block;width:90px;height:8px;background:var(--panel2);border-radius:2px;vertical-align:middle;overflow:hidden;margin-right:6px}
.confbar i{display:block;height:100%;background:var(--accent)}
.tape{overflow:hidden;background:#06090f;border:1px solid var(--line);border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;white-space:nowrap;margin-top:8px}
.tape .run{display:inline-flex;gap:28px;padding:7px 0}
.tape .lab{position:sticky;left:0}
.tape span{flex:0 0 auto}
@media (prefers-reduced-motion:reduce){.tape{overflow-x:auto}}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.feat div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12.5px}
.feat div b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.veto{border-left:3px solid var(--warn);padding:6px 10px;background:rgba(243,192,79,.06);border-radius:0 8px 8px 0;font-size:13.5px;margin:6px 0}
.pickrow{display:grid;grid-template-columns:64px 120px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start;font-size:13.5px}
.pickrow:last-child{border-bottom:0}
.pickrow button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font:inherit;font-weight:700;text-align:left}

/* 봇 법정 */
.court-pick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-bottom:12px}
.court-pick label{font-size:12.5px;color:var(--muted);display:block}
.court-pick select{width:100%;margin-top:4px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px}
.side-a{color:#88aaff}.side-b{color:#f0b35a}
.banner{display:flex;gap:8px 16px;flex-wrap:wrap;align-items:center;background:var(--panel2);border-radius:10px;padding:10px 14px;margin-bottom:10px;font-size:14px}
.banner b{font-size:16px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.badge{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid}
.badge.w{color:var(--warn);border-color:rgba(243,192,79,.5);background:rgba(243,192,79,.08)}
.badge.d{color:var(--down);border-color:rgba(255,107,107,.5);background:rgba(255,107,107,.08)}
.chart{width:100%;height:auto;display:block;background:#0a0f1a;border-radius:10px;border:1px solid var(--line);touch-action:manipulation}
.chart text{fill:var(--faint);font-size:11px;font-family:inherit}
.chart circle{cursor:pointer}
.chart circle.on{stroke:#fff;stroke-width:2}
.mtab td.a{color:#b9c9ff}.mtab td.b{color:#f6c98a}
.tdetail{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px}
.tdetail:empty{display:none}
.ltree ul{list-style:none;margin:0;padding-left:18px;border-left:1px dashed var(--line)}
.ltree>ul{padding-left:0;border:0}
.ltree li{padding:4px 0}
.bars{display:grid;gap:8px}
.bars .row2{display:grid;grid-template-columns:130px 1fr 92px;gap:10px;align-items:center;font-size:13.5px}
.meter{height:10px;background:var(--panel2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.hi{background:var(--warn)} .meter i.over{background:var(--down)}
.cd{display:flex;gap:12px;align-items:center}
.cd b{font-size:28px;font-weight:700}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){
  .fx{display:block}
  .fx-side{position:fixed;z-index:40;left:0;top:0;bottom:0;width:min(300px,86vw);transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(16px + env(safe-area-inset-top,0))}
  .fx.menu .fx-side{transform:none}
  .fx.menu .fx-scrim{display:block;position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.5)}
  .fx-top{display:flex;position:sticky;top:0;z-index:30;gap:10px;align-items:center;background:rgba(12,17,29,.96);border-bottom:1px solid var(--line);padding:8px 12px;backdrop-filter:blur(6px)}
  .fx-top .ham{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;width:40px;height:36px;font-size:18px;cursor:pointer}
  .fx-top .tt{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fx-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;z-index:30;left:0;right:0;bottom:0;background:rgba(10,15,26,.97);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0))}
  .fx-tabs a{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);text-decoration:none;font-size:11px;padding:5px 2px;border-radius:8px;position:relative;min-height:44px;justify-content:center}
  .fx-tabs a .ic{font-size:18px;line-height:1}
  .fx-tabs a.on{color:var(--accent);background:var(--panel)}
  .fx-tabs a .nb{position:absolute;top:2px;right:18%;font-size:10px;line-height:15px;min-width:15px}
  .fx-main .wrap{padding-bottom:96px}
  .fhead h1{font-size:18px}
  .fhead .upd{text-align:left}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .court-pick{grid-template-columns:1fr}
  .court-pick .swap{justify-self:start}
  .bars .row2{grid-template-columns:100px 1fr 80px}
}
@media (max-width:560px){.pickrow{grid-template-columns:56px 1fr}.pickrow .rs{grid-column:1/-1}.office{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div id="app"></div>
<script>// ===== 폴더형 대시보드 (2026-11-23) =====
// 데이터는 기존과 같은 암호문 하나를 한 번만 푼다. 폴더를 열 때 그 폴더 화면만 그린다 (지연 그리기).
// 사용자 설정(폴더 고정·숨기기·순서, 위젯 접기)은 이 기기의 localStorage 에만 저장한다 (데이터·비밀번호와 무관).
const FolderApp = (() => {
  const PREF_KEY = "aisec_folders_v1";
  const DEPT_SUB = ["earnings-ai", "chart-ai", "swing-lab"];
  const FOLDERS = [
    {id: "hq", ic: "🏢", name: "본사 개요", kind: "섀도"},
    {id: "floor", ic: "🖥️", name: "트레이딩 플로어", kind: "섀도"},
    {id: "depts", ic: "🗂️", name: "부서", kind: "섀도", sub: DEPT_SUB.map(x => ({id: "depts/" + x, ic: "·", name: x, kind: "섀도"}))},
    {id: "league", ic: "🏆", name: "애널리스트 리그", kind: "섀도"},
    {id: "court", ic: "⚖️", name: "봇 법정", kind: null},
    {id: "risk", ic: "🛡️", name: "리스크", kind: "섀도"},
    {id: "research", ic: "🔬", name: "연구", kind: "섀도"},
    {id: "ops", ic: "💵", name: "비용·실행", kind: "운영"},
    {id: "dev", ic: "🛠️", name: "개발 로그", kind: "운영"},
  ];
  const ALL = FOLDERS.flatMap(f => [f, ...(f.sub || [])]);
  const byId = id => ALL.find(f => f.id === id);
  const DEFAULT = {order: FOLDERS.map(f => f.id), hidden: [], pinned: ["hq", "floor", "court", "risk"], collapsed: {}};
  let D = null, editing = false, menuOpen = false;
  const ui = {floorDay: null, floorSel: null, floorTicker: null, courtCut: null, courtSel: null};

  // ---------- 설정 저장 (try/catch: 사생활 모드 등에서 저장이 막혀도 화면은 동작) ----------
  function loadPrefs(){
    let p = {};
    try { p = JSON.parse(localStorage.getItem(PREF_KEY) || "{}") || {}; } catch(_) { p = {}; }
    const ids = FOLDERS.map(f => f.id);
    const order = (Array.isArray(p.order) ? p.order : []).filter(x => ids.includes(x));
    ids.forEach(x => { if (!order.includes(x)) order.push(x); });   // 새 폴더는 뒤에 자동 추가
    return {order, hidden: (p.hidden || []).filter(x => ALL.some(f => f.id === x)),
            pinned: Array.isArray(p.pinned) ? p.pinned.filter(x => ALL.some(f => f.id === x)) : DEFAULT.pinned.slice(),
            collapsed: p.collapsed && typeof p.collapsed === "object" ? p.collapsed : {}};
  }
  let prefs = loadPrefs();
  function savePrefs(){ try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch(_){} }

  // ---------- 도우미 ----------
  const KIND_CLS = {"섀도": "k-shadow", "백테스트": "k-bt", "페이퍼": "k-paper", "실계좌": "k-live", "운영": "k-ops"};
  const KIND_TIP = {"섀도": "가상 장부·채점 (실제 주문 없음)", "백테스트": "과거 데이터로 다시 계산", "페이퍼": "증권사 모의 계좌", "실계좌": "실제 돈", "운영": "실행·비용·개발 기록 (매매 성적 아님)"};
  const kind = k => k ? `<span class="kind ${KIND_CLS[k] || ""}" title="${esc(KIND_TIP[k] || "")}">${esc(k === "운영" ? "운영 기록" : k)}</span>` : "";
  const tz = (iso, zone) => { try { return new Intl.DateTimeFormat("ko-KR", {timeZone: zone, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false}).format(new Date(iso)).replace(/\.\s?/g, "-").replace(/-\s?(\d\d:)/, " $1").replace(/^(\d\d-\d\d)-?\s*/, "$1 "); } catch(_) { return "–"; } };
  const both = iso => iso ? `${tz(iso, "America/New_York")} ET / ${tz(iso, "Asia/Seoul")} KST` : "–";
  const utcIso = s => s ? String(s).replace(" ", "T") + (String(s).length <= 16 ? ":00Z" : "") : null;  // "2026-11-21 04:08" (UTC) → ISO
  const money = v => isNum(v) ? `${v < 0 ? "−" : ""}$${Math.round(Math.abs(v)).toLocaleString("ko-KR")}` : "–";
  const sm = v => isNum(v) ? `${v > 0 ? "+" : v < 0 ? "−" : ""}$${Math.round(Math.abs(v)).toLocaleString("ko-KR")}` : "–";
  const md = s => esc(String(s || "").slice(5));
  const bdays = (a, b) => { let n = 0; const d = new Date(a + "T00:00:00Z"), e = new Date(b + "T00:00:00Z"); while (d < e) { d.setUTCDate(d.getUTCDate() + 1); const w = d.getUTCDay(); if (w && w < 6) n++; } return n; };
  const fail = s => s && s.error ? `<p class="empty">이 구역을 불러오지 못했습니다 (${esc(s.error)}).</p>` : "";

  // ---------- 가벼운 차트 하나 (SVG, 외부 라이브러리 없음) ----------
  const Chart = {
    scale(d0, d1, r0, r1){ const k = (r1 - r0) / ((d1 - d0) || 1); return v => r0 + (v - d0) * k; },
    bars(vals, labels, {h = 140, color = "var(--accent)", fmt = v => v} = {}){
      if (!vals.length) return '<p class="empty">기록 없음</p>';
      const W = 640, mx = Math.max(...vals, 1e-9), bw = W / vals.length;
      const y = Chart.scale(0, mx, h - 18, 8);
      return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="막대 그래프">${vals.map((v, i) =>
        `<rect x="${(i * bw + 1).toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(1, bw - 2).toFixed(1)}" height="${(h - 18 - y(v)).toFixed(1)}" fill="${color}" opacity=".85"><title>${esc(labels[i])}: ${esc(fmt(v))}</title></rect>`).join("")}
        <text x="2" y="${h - 4}">${esc(labels[0] || "")}</text><text x="${W - 2}" y="${h - 4}" text-anchor="end">${esc(labels[labels.length - 1] || "")}</text>
        <text x="${W - 2}" y="12" text-anchor="end">최대 ${esc(fmt(mx))}</text></svg>`;
    },
    scatter(pts, {xl, yl, h = 240} = {}){
      if (!pts.length) return '<p class="empty">기록 없음</p>';
      const W = 640, xs = pts.map(p => p.x), ys = pts.map(p => p.y);
      const x = Chart.scale(Math.min(...xs, -1.2), Math.max(...xs, 0), 40, W - 10), y = Chart.scale(Math.min(...ys, 0), Math.max(...ys, 2.2), h - 26, 10);
      return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(xl)} 대 ${esc(yl)}">
        <line x1="${x(0)}" x2="${x(0)}" y1="8" y2="${h - 24}" stroke="var(--line)"/><line x1="40" x2="${W - 10}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
        ${pts.map(p => `<circle cx="${x(p.x).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="4.5" fill="${p.c}" opacity=".85"><title>${esc(p.t)}</title></circle>`).join("")}
        <text x="${W / 2}" y="${h - 6}" text-anchor="middle">${esc(xl)}</text><text x="4" y="14">${esc(yl)}</text></svg>`;
    },
    radar(axes, vals, cap){
      const W = 320, c = W / 2, R = 118, n = axes.length, mx = Math.max(cap, ...vals) || 1;
      const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n, r = v / mx * R; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
      const ring = f => axes.map((_, i) => pt(i, mx * f).map(v => v.toFixed(1)).join(",")).join(" ");
      return `<svg class="chart" viewBox="0 0 ${W} ${W}" style="max-width:360px;margin:0 auto" role="img" aria-label="섹터 노출 레이더">
        ${[.25, .5, .75, 1].map(f => `<polygon points="${ring(f)}" fill="none" stroke="var(--line)"/>`).join("")}
        ${axes.map((a, i) => { const [x, y] = pt(i, mx * 1.13); return `<line x1="${c}" y1="${c}" x2="${pt(i, mx)[0]}" y2="${pt(i, mx)[1]}" stroke="var(--line)"/><text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle">${esc(a)}</text>`; }).join("")}
        <polygon points="${vals.map((v, i) => pt(i, v).map(x => x.toFixed(1)).join(",")).join(" ")}" fill="rgba(136,170,255,.25)" stroke="var(--accent)" stroke-width="2"/>
        <text x="${c + 4}" y="${c - R - 2}">${mx.toFixed(0)}%</text></svg>`;
    },
  };

  // ---------- 이상 징후 (텔레그램 아침 요약과 같은 기준 + 문서에 고정한 2가지) ----------
  // 기준 문서: docs/대시보드_폴더형_2026-11-23.md 3절. 손실 연속 3건 이상, 하루 AI 비용이 직전 7일 중앙값의 3배 이상이고 $0.05 초과
  function anomalies(){
    const out = {}, add = (f, msg, info) => (out[f] = out[f] || []).push({msg, info});
    const G = D.gate || {}, P = D.performance || {}, R = D.runs || {}, O = D.ops || {}, F = D.floor || {};
    if (G.halted) { add("hq", `킬스위치 발동 — ${(G.reasons || []).join(", ")}`); add("risk", "킬스위치 발동, 신규 진입 중단"); }
    if (stale(D.generated_utc)) add("hq", "하루 넘게 갱신되지 않음 — 일일 업무 실패 여부 확인");
    if (G.desk_lag) add("floor", G.desk_lag.used ? `오늘 애널리스트 추천 없음 → ${G.desk_lag.used.slice(5)} 추천으로 판정` : `애널리스트 추천 없음 → ${G.desk_lag.only || "다른 부서"} 후보만으로 판정`);
    if ((G.px_missing || []).length) add("risk", `시세 못 받은 보유 종목 ${G.px_missing.length}개`);
    if (G.regime && G.regime.state && G.regime.state !== "normal") add("risk", `시장 국면: ${G.regime.label}`, true);
    const st = (P.depts || []).filter(r => r.is_stale);
    if (st.length) add("depts", `신호 멈춤: ${st.map(r => `${r.label} ${r.stale_days}거래일`).join(", ")}`);
    let streak = 0;
    for (const c of (G.closed || [])) { if (isNum(c.pnl_usd) && c.pnl_usd < 0) streak++; else break; }
    if (streak >= 3) add("risk", `최근 청산 ${streak}건 연속 손실`);
    const fails = (R.repos || []).reduce((a, r) => a + (r.fail || 0), 0);
    if (fails) add("ops", `이번 달 실행 실패 ${fails}회`);
    const cd = (O.cost_daily || []).map(x => x.total).filter(isNum);
    if (cd.length >= 4) {
      const last = cd[cd.length - 1], prev = cd.slice(-8, -1).sort((a, b) => a - b), med = prev[Math.floor(prev.length / 2)];
      if (last > 0.05 && med > 0 && last >= med * 3) add("ops", `AI 비용 급증: 최근 하루 $${last.toFixed(2)} (직전 중앙값 $${med.toFixed(2)}의 ${(last / med).toFixed(1)}배)`);
    }
    const err = floorDesks(F, (F.days || []).length - 1).filter(x => x.st === "err");
    if (err.length) add("floor", `오류 상태 책상: ${err.map(x => x.name).join(", ")}`);
    const rb = ((D.research || {}).books || []).filter(b => b.v0_ok === false);
    if (rb.length) add("research", "V0 대조 실패 — 대안 장부 결과 무효 표시 필요");
    const pend = ((D.devlog || {}).approval || [])[0];
    if (pend && pend.rows.length) add("dev", `승인 대기 표 ${pend.rows.length}건`, true);
    return out;
  }
  const badgeCount = (A, id) => (A[id] || []).filter(x => !x.info).length + (id === "depts" ? DEPT_SUB.reduce((a, s) => a + (A["depts/" + s] || []).length, 0) : 0);

  // ---------- 틀 (왼쪽 폴더 트리 / 휴대폰: 햄버거 메뉴 + 하단 탭) ----------
  function route(){
    const h = (location.hash || "").replace(/^#\/?/, ""), [path, q] = h.split("?");
    const params = {}; (q || "").split("&").filter(Boolean).forEach(kv => { const [k, v] = kv.split("="); params[decodeURIComponent(k)] = decodeURIComponent(v || ""); });
    return {id: byId(path) ? path : "hq", params};
  }
  function navTree(cur, A){
    const row = (f, isSub) => {
      const hid = prefs.hidden.includes(f.id), pin = prefs.pinned.includes(f.id), n = badgeCount(A, f.id);
      if (hid && !editing) return "";
      return `<li class="${hid ? "hid" : ""}"><a href="#/${f.id}" class="${cur === f.id ? "on" : ""}" ${cur === f.id ? 'aria-current="page"' : ""}>
        <span class="ic" aria-hidden="true">${f.ic}</span><span class="nm">${esc(f.name)}</span>${n ? `<span class="nb" title="이상 징후 ${n}건">${n}</span>` : ""}
        <span class="ed">${isSub ? "" : `<button data-mv="${f.id}" data-d="-1" aria-label="${esc(f.name)} 위로">▲</button><button data-mv="${f.id}" data-d="1" aria-label="${esc(f.name)} 아래로">▼</button>`}
        <button data-pin="${f.id}" class="${pin ? "on" : ""}" aria-label="${esc(f.name)} 하단 탭 고정">📌</button><button data-hide="${f.id}" class="${hid ? "on" : ""}" aria-label="${esc(f.name)} 숨기기">👁</button></span></a>
        ${f.sub ? `<ul>${f.sub.map(s => row(s, true)).join("")}</ul>` : ""}</li>`;
    };
    return `<ul class="tree">${prefs.order.map(id => FOLDERS.find(f => f.id === id)).map(f => row(f, false)).join("")}</ul>`;
  }
  function tabs(cur, A){
    const pins = prefs.pinned.filter(id => !prefs.hidden.includes(id)).slice(0, 4);
    return pins.map(id => { const f = byId(id), n = badgeCount(A, id);
      return `<a href="#/${id}" class="${cur === id || (cur.startsWith(id + "/")) ? "on" : ""}"><span class="ic" aria-hidden="true">${f.ic}</span>${esc(f.name.replace("트레이딩 ", "").replace("애널리스트 ", ""))}${n ? `<span class="nb">${n}</span>` : ""}</a>`; }).join("")
      + `<a href="#" data-menu="1"><span class="ic" aria-hidden="true">☰</span>전체</a>`;
  }

  function shell(){
    const {id, params} = route(), f = byId(id), A = anomalies();
    const al = (A[id] || []).map(x => `<div class="${x.info ? "info" : ""}">${x.info ? "ℹ️" : "⚠️"} ${esc(x.msg)}</div>`).join("");
    app.innerHTML = `<div class="fx ${menuOpen ? "menu" : ""} ${editing ? "editing" : ""}" id="fx">
      <nav class="fx-side" aria-label="폴더"><div class="brand">AI 증권사 <small>${esc(D.generated_kst || "")}</small></div>
        ${navTree(id, A)}
        <div class="side-help">▲▼ 순서 · 📌 휴대폰 하단 탭 고정(앞의 4개) · 👁 숨기기. 숨긴 폴더도 주소(#/…)로는 열립니다.</div>
        <div class="side-tools"><button id="edit">${editing ? "편집 끝" : "폴더 편집"}</button>${editing ? '<button id="reset">설정 초기화</button>' : ""}
          ${D.trigger ? '<button id="refresh" class="refresh">지금 갱신</button>' : ""}<button id="lock">잠그기</button></div></nav>
      <div class="fx-scrim" id="scrim"></div>
      <div class="fx-main">
        <div class="fx-top"><button class="ham" id="ham" aria-label="폴더 메뉴 열기" aria-expanded="${menuOpen}">☰</button><span class="tt">${f.ic} ${esc(f.name)}</span>
          <span class="muted" style="font-size:12px">${esc(ageText(D.generated_utc))}</span></div>
        <div class="wrap">
          <div class="fhead"><h1><span aria-hidden="true">${f.ic}</span>${esc(f.name)} ${kind(f.kind)}</h1>
            <div class="upd">업데이트: <b>${esc(both(D.generated_utc))}</b> (${esc(ageText(D.generated_utc))})<br>
              <span class="faint">실시간 체결이 아니라 마지막 실행 시점의 데이터입니다</span></div></div>
          <div class="status" id="status" role="status" aria-live="polite">${stale(D.generated_utc) ? "하루 넘게 갱신되지 않았습니다. 일일 업무가 실패했는지 확인해 주세요." : ""}</div>
          ${al ? `<div class="alerts">${al}</div>` : ""}
          <div id="content">${page(id, params)}</div>
          <footer>폴더를 열 때 그 화면만 그립니다. 성적은 가상 장부·채점 기준이며 실제 매매 결과가 아닙니다 (각 화면의 데이터 종류 라벨 참고).</footer>
        </div></div>
      <nav class="fx-tabs" aria-label="즐겨찾기 폴더">${tabs(id, A)}</nav></div>`;
    decorate(id);
    wire(id);
  }

  // 각 위젯 제목을 접기 버튼으로 바꾸고, 접힘 상태를 기기에 기억
  function decorate(id){
    document.querySelectorAll("#content section.panel, #content section.hero").forEach((s, i) => {
      const h = s.querySelector(":scope > h2");
      const key = `${id}:${s.dataset.w || (h ? h.childNodes[0].textContent.trim() : "w" + i)}`;
      if (!h) return;
      const label = h.innerHTML;
      h.innerHTML = `<button class="wtog" aria-expanded="${!prefs.collapsed[key]}"><span class="car" aria-hidden="true">▾</span><span>${label}</span></button>`;
      if (prefs.collapsed[key]) s.classList.add("wcol");
      h.querySelector(".wtog").onclick = () => {
        const c = s.classList.toggle("wcol");
        if (c) prefs.collapsed[key] = 1; else delete prefs.collapsed[key];
        h.querySelector(".wtog").setAttribute("aria-expanded", String(!c)); savePrefs();
      };
    });
  }

  function wire(id){
    const $ = s => document.getElementById(s);
    $("lock").onclick = () => { currentPw = null; try { localStorage.removeItem(KEY); } catch(_){} gate("잠갔습니다."); };
    if ($("refresh")) $("refresh").onclick = () => refreshNow(D.trigger);
    $("edit").onclick = () => { editing = !editing; shell(); };
    if ($("reset")) $("reset").onclick = () => { prefs = JSON.parse(JSON.stringify(DEFAULT)); savePrefs(); shell(); };
    const setMenu = v => { menuOpen = v; $("fx").classList.toggle("menu", v); $("ham").setAttribute("aria-expanded", String(v)); };
    $("ham").onclick = () => setMenu(!menuOpen);
    $("scrim").onclick = () => setMenu(false);

  // ---------- 봇 법정 ----------
  function metricsAt(b, cut){
    const curve = b.curve.filter(c => !cut || c.date <= cut), eq = curve.map(c => c.equity);
    const tr = b.trades.filter(t => t.status !== "open" && isNum(t.pnl) && (!cut || (t.exit_date || t.entry_date) <= cut));
    const rs = tr.map(t => t.r).filter(isNum), rets = eq.slice(1).map((v, i) => v / eq[i] - 1);
    const mean = rets.reduce((a, v) => a + v, 0) / (rets.length || 1), sd = Math.sqrt(rets.reduce((a, v) => a + (v - mean) ** 2, 0) / ((rets.length - 1) || 1));
    let peak = -Infinity, mdd = 0; eq.forEach(v => { peak = Math.max(peak, v); mdd = Math.min(mdd, v / peak - 1); });
    return {curve, trades: tr, ret: eq.length > 1 ? (eq[eq.length - 1] / eq[0] - 1) * 100 : null, mdd: eq.length > 1 ? mdd * 100 : null,
            win: tr.length ? tr.filter(t => t.pnl > 0).length / tr.length * 100 : null, avgR: rs.length ? rs.reduce((a, v) => a + v, 0) / rs.length : null,
            n: tr.length, sharpe: rets.length >= 10 && sd > 0 ? mean / sd * Math.sqrt(252) : null, last: eq[eq.length - 1]};
  }

      ${row("수수료·슬리피지", esc(A.costs), esc(B.costs))}${row("설명", `<span class="why">${esc(A.note)}</span>`, `<span class="why">${esc(B.note)}</span>`)}</tbody></table></div>`;
    const list = side => { const [b, m] = side === "A" ? [A, ma] : [B, mb]; return m.trades.slice().reverse().slice(0, 40).map((t, i) => `<tr data-tr="${side}:${b.trades.indexOf(t)}" style="cursor:pointer"><td><span class="name side-${side.toLowerCase()}">${esc(t.ticker)}</span></td><td class="muted">${md(t.exit_date)}</td><td>${esc(t.reason || "")}</td><td class="${sign(t.pnl)}">${sm(t.pnl)}</td></tr>`).join(""); };

        <div class="scroll"><table><tbody>${list("A") || '<tr><td class="muted">없음</td></tr>'}</tbody></table></div><div class="scroll"><table><tbody>${list("B") || '<tr><td class="muted">없음</td></tr>'}</tbody></table></div></div></details></section>`;

  function courtChart(A, B, ma, mb, dates, oos){
    const W = 760, H = 300, L = 54, Rr = 12, T = 14, Bt = 26, xi = {}; dates.forEach((d, i) => xi[d] = i);
    const all = [...ma.curve, ...mb.curve].map(c => c.equity), lo = Math.min(...all), hi = Math.max(...all), pad = (hi - lo) * .08 || 500;
    const x = Chart.scale(0, Math.max(1, dates.length - 1), L, W - Rr), y = Chart.scale(lo - pad, hi + pad, H - Bt, T);
    const line = (m, c) => `<polyline fill="none" stroke="${c}" stroke-width="2.2" points="${m.curve.filter(p => p.date in xi).map(p => `${x(xi[p.date]).toFixed(1)},${y(p.equity).toFixed(1)}`).join(" ")}"/>`;
    const eqAt = (m, d) => { let v = null; for (const p of m.curve) { if (p.date <= d) v = p.equity; } return v; };
    const near = d => { let k = null; for (const dd of dates) if (dd <= d) k = dd; return k; };
    // 같은 날 청산이 여러 건이면 점을 위(A)·아래(B)로 쌓아 하나씩 누를 수 있게 한다
    const dots = (b, m, side) => { const seen = {}; return m.trades.map(t => { const d = near(t.exit_date || t.entry_date), v = d && eqAt(m, d); if (!d || !isNum(v)) return "";
      const k = seen[d] = (seen[d] || 0) + 1, cy = y(v) + (side === "A" ? -1 : 1) * (k - 1) * 11;
      return `<circle data-tr="${side}:${b.trades.indexOf(t)}" class="${ui.courtSel === side + ":" + b.trades.indexOf(t) ? "on" : ""}" cx="${x(xi[d]).toFixed(1)}" cy="${cy.toFixed(1)}" r="5" fill="${t.pnl > 0 ? "#4fd18b" : "#ff6b6b"}" stroke="${side === "A" ? "#88aaff" : "#f0b35a"}" stroke-width="1.5"><title>${esc(t.ticker)} ${esc(t.reason || "")} ${sm(t.pnl)}</title></circle>`; }).join(""); };
    const ticks = [lo, (lo + hi) / 2, hi].map(v => `<text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">$${(v / 1000).toFixed(1)}k</text><line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join("");
    const base = `<line x1="${L}" x2="${W - Rr}" y1="${y(D.court.start_usd)}" y2="${y(D.court.start_usd)}" stroke="var(--faint)" stroke-dasharray="6 4"/><text x="${W - Rr}" y="${y(D.court.start_usd) - 4}" text-anchor="end">시작 자금</text>`;
    // 학습/검증(아웃오브샘플) 경계: 백테스트 장부에만 그린다
    let bnd = "";
    const bt = [A, B].find(b => b.kind === "백테스트" && b.boundary);
    if (bt) {
      if (bt.boundary > dates[0] && bt.boundary <= dates[dates.length - 1]) { const i = dates.findIndex(d => d >= bt.boundary);
        bnd = `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - Bt}" stroke="#f3c04f" stroke-dasharray="5 3"/><text x="${x(i) + 4}" y="${T + 10}" fill="#f3c04f" style="fill:#f3c04f">← 학습 | 검증(OOS) →</text>`; }
      else bnd = `<text x="${L + 4}" y="${T + 10}" style="fill:#f3c04f">${bt.boundary <= dates[0] ? `전 구간 검증(OOS): AI 학습 마감 이후 (${esc(bt.boundary)}부터) 데이터` : `전 구간이 학습 기간 (${esc(bt.boundary)} 이전) — 공식 성적 아님`}</text>`;
    }
    return `<svg class="chart" id="cchart" viewBox="0 0 ${W} ${H}" role="img" aria-label="A ${esc(A.label)}와 B ${esc(B.label)} 자산 곡선">${ticks}${base}${bnd}
      ${line(ma, "#88aaff")}${line(mb, "#f0b35a")}${dots(A, ma, "A")}${dots(B, mb, "B")}
      <text x="${L}" y="${H - 6}">${esc(dates[0])}</text><text x="${W - Rr}" y="${H - 6}" text-anchor="end">${esc(dates[dates.length - 1])}</text></svg>`;
  }

  // ---------- 리스크 ----------
  const SECT = ["Technology", "Healthcare", "Financial Services", "Energy", "Industrials", "Consumer Cyclical", "Consumer Defensive", "Communication Services", "Utilities", "Real Estate", "Basic Materials"];
  const SECT_KO = {"Technology": "기술", "Healthcare": "헬스케어", "Financial Services": "금융", "Energy": "에너지", "Industrials": "산업재", "Consumer Cyclical": "경기소비재",
                   "Consumer Defensive": "필수소비재", "Communication Services": "통신", "Utilities": "유틸리티", "Real Estate": "부동산", "Basic Materials": "소재"};
  function riskPage(){
    const K = D.risk;
    if (!K || K.error) return `<section class="panel"><h2>노출·상관 분석</h2>${fail(K)}</section>`;
    const sv = {}; (K.sectors || []).forEach(s => sv[s.sector] = s.pct || 0);
    const axes = [...new Set([...SECT, ...Object.keys(sv)])];
    const lim = (K.limits || []).map(l => { const r = isNum(l.used) && l.cap ? l.used / l.cap : 0;
      return `<div class="row2"><span>${esc(l.name)}</span><span class="meter"><i class="${r > 1 ? "over" : r >= .8 ? "hi" : ""}" style="width:${Math.min(100, r * 100).toFixed(0)}%"></i></span><span class="num">${isNum(l.used) ? l.used : "–"} / ${esc(l.cap)}${esc(l.unit)}</span></div>`; }).join("");
    const cl = (K.clusters || []).map(c => `<tr><td><span class="name">${esc(c.ticker)}</span><span class="desc">${esc(c.sector || "")}</span></td><td class="muted">${md(c.date)}</td><td class="${sign(c.pnl)}">${sm(c.pnl)}</td><td class="${sign(c.ret)}">${spct(c.ret)}</td><td class="${sign(c.spy)}">${spct(c.spy)}</td><td class="why">${esc(c.verdict || "")}</td></tr>`).join("");
    const cr = K.corr, mx = cr && cr.matrix ? Object.keys(cr.matrix) : [];
    const heat = mx.length ? `<div class="scroll"><table style="font-size:12.5px"><thead><tr><th></th>${mx.map(k => `<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${mx.map(a => `<tr><td><b>${esc(a)}</b></td>${mx.map(b => { const v = cr.matrix[a][b];
      return `<td style="background:${isNum(v) && a !== b ? `rgba(${v > 0 ? "255,107,107" : "136,170,255"},${Math.min(.6, Math.abs(v) * .7).toFixed(2)})` : "transparent"}">${isNum(v) ? v.toFixed(2) : "–"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>` : '<p class="empty">상관 기록 없음</p>';
    const mm = (K.mae_mfe || []).filter(t => isNum(t.mae_r) && isNum(t.mfe_r));
    return `<section class="panel" data-w="radar"><h2>노출 레이더 <small>보유 평가 금액 ÷ 계좌 ${money(K.equity)}, 섹터별</small> ${kind("섀도")}</h2>
        <div class="grid-field" style="grid-template-columns:1fr 1fr"><div>${Chart.radar(axes.map(a => SECT_KO[a] || a), axes.map(a => sv[a] || 0), 15)}</div>
        <div><h3 style="font-size:14px;margin:0 0 8px">한도 사용률 <span class="faint" style="font-weight:400">firm/gate_rules.yaml (읽기만)</span></h3><div class="bars">${lim}</div></div></div></section>
      <section class="panel" data-w="cluster"><h2>동시 손절·상관 <small>연구 도구 결과 (data/research)</small> ${kind("섀도")}</h2>
        ${cl ? `<div class="scroll hold"><table><thead><tr><th>종목</th><th>손절일</th><th>손익</th><th>수익률</th><th>SPY</th><th style="text-align:left">섹터 한도로 막았나</th></tr></thead><tbody>${cl}</tbody></table></div>` : '<p class="empty">동시 손절 기록 없음</p>'}
        <h3 style="font-size:14px;margin:14px 0 6px">보유 종목 상관 ${cr ? `<span class="faint" style="font-weight:400">${esc(cr.date)} · ${esc(cr.window || "")}</span>` : ""}</h3>${heat}</section>
      <section class="panel" data-w="maemfe"><h2>MAE/MFE 분포 <small>V0(현행 재계산) 거래별 최대 역행·최대 순행 (R 단위)</small> ${kind("섀도")}</h2>
        ${Chart.scatter(mm.map(t => ({x: t.mae_r, y: t.mfe_r, c: (t.exit_r || 0) > 0 ? "#4fd18b" : "#ff6b6b", t: `${t.ticker} MAE ${t.mae_r}R, MFE ${t.mfe_r}R, 결과 ${t.exit_r ?? "보유 중"}R`})), {xl: "MAE (R, 왼쪽일수록 깊게 역행)", yl: "MFE (R)"})}
        <p class="faint" style="font-size:12.5px">초록 = 이익으로 끝남, 빨강 = 손실 또는 보유 중. MFE 가 2R 근처인데 빨강이면 '목표 직전에 되돌림'입니다. ${mm.length}건, 기록용·판정과 무관.</p></section>`;
  }

  // ---------- 연구 ----------
  function researchPage(){
    const S = D.research;
    if (!S || S.error) return `<section class="panel"><h2>연구</h2>${fail(S)}</section>`;
    const rj = (S.rejected || []).map(r => `<tr><td><span class="name">${esc(r.ticker)}</span><span class="desc">${esc(r.sector || "")}</span></td><td class="muted">${md(r.date)}</td><td class="why">${esc(r.fails || r.cats || "")}</td>
      <td>${esc(r.status === "open" ? "가상 보유 중" : r.status === "closed" ? "가상 청산" : r.status || "–")}</td><td class="${sign(r.pnl)}">${sm(r.pnl)}</td><td class="${sign(r.r)}">${isNum(r.r) ? r.r.toFixed(2) + "R" : "–"}</td></tr>`).join("");
    const sum = (S.rejected || []).filter(r => isNum(r.pnl)).reduce((a, r) => a + r.pnl, 0);
    const bk = (S.books || []).map(b => `<tr><td><a href="#/court?a=live&b=${encodeURIComponent("alt:" + b.book)}">${esc(b.book)}</a></td><td class="${sign(b.ret)}">${spct(b.ret)}</td><td class="down">${spct(b.mdd)}</td><td class="${b.cash_min < 0 ? "down" : ""}">${money(b.cash_min)}</td>
      <td class="${b.v0_ok === false ? "down" : "up"}">${b.v0_ok === false ? "실패" : b.v0_ok ? "통과" : "–"}</td><td class="muted">${md(b.date)}</td></tr>`).join("");
    const tm = S.timemachine, tg = tm && tm.groups ? Object.entries(tm.groups).map(([k, g]) => `<tr><td>${esc(k)}</td><td>${int(g.n_pred)}</td><td>${int(g.n_scored)}</td><td>${isNum(g.avg_p_target) ? (g.avg_p_target * 100).toFixed(0) + "%" : "–"}</td><td>${isNum(g.avg_p_stop) ? (g.avg_p_stop * 100).toFixed(0) + "%" : "–"}</td><td class="${sign(g.avg_R_actual)}">${isNum(g.avg_R_actual) ? g.avg_R_actual.toFixed(2) + "R" : "–"}</td></tr>`).join("") : "";
    return `<section class="panel" data-w="rejected"><h2>거절 종목 추적 <small>게이트가 거절한 종목을 샀다면 (가상, ${int(S.n_rejected)}건)</small> ${kind("섀도")}</h2>
        <p class="muted" style="font-size:13px;margin:0 0 8px">거절 종목 가상 손익 합계 <b class="${sign(sum)}">${sm(sum)}</b> — 음수면 거절이 손실을 막은 것. 표본이 작아 판정용 아님.</p>
        ${rj ? `<div class="scroll hold"><table><thead><tr><th>종목</th><th>신호</th><th style="text-align:left">거절 이유</th><th>상태</th><th>가상 손익</th><th>R</th></tr></thead><tbody>${rj}</tbody></table></div>` : '<p class="empty">거절 기록 없음</p>'}</section>
      <section class="panel" data-w="books"><h2>그림자 장부 V0~V3 <small>이름을 누르면 법정에서 현행과 비교</small> ${kind("섀도")}</h2>
        ${bk ? `<div class="scroll"><table><thead><tr><th>장부</th><th>수익률</th><th>MDD</th><th>최저 현금</th><th>V0 대조</th><th>기준일</th></tr></thead><tbody>${bk}</tbody></table></div>` : '<p class="empty">그림자 장부 기록 없음</p>'}</section>
      ${tg ? `<section class="panel" data-w="tm"><h2>Time Machine <small>${esc(tm.asof || "")} · 그룹별 예측 vs 실제 (채점 50건 미만은 판단 보류)</small> ${kind("섀도")}</h2>
        <div class="scroll"><table><thead><tr><th>그룹</th><th>예측</th><th>채점</th><th>목표 먼저 확률</th><th>손절 먼저 확률</th><th>실제 평균</th></tr></thead><tbody>${tg}</tbody></table></div></section>` : ""}`;
  }

  // ---------- 비용·실행 ----------
  function opsPage(){
    const O = D.ops;
    if (!O || O.error) return `<section class="panel"><h2>비용 추이</h2>${fail(O)}</section>`;
    const cd = O.cost_daily || [];
    const tk = (O.tokens || []).map(t => { const days = Math.ceil((Date.parse(t.date + "T00:00:00+09:00") - Date.now()) / 864e5);
      return `<div class="inner cd"><b class="num ${days <= 30 ? "warn" : ""}">D-${days}</b><div><b style="font-size:14px">${esc(t.title)}</b><br><span class="muted" style="font-size:13px">${esc(t.date)} 만료${days <= 30 ? " · 곧 교체 필요" : ""}</span></div></div>`; }).join("");
    return `<section class="panel" data-w="trend"><h2>API 비용 추이 <small>본사 AI 호출, 날짜별 (UTC), 최근 ${cd.length}일</small> ${kind("운영")}</h2>
        ${Chart.bars(cd.map(x => x.total || 0), cd.map(x => x.date), {fmt: v => "$" + v.toFixed(3)})}</section>
      <section class="panel" data-w="tokens"><h2>토큰 만료 카운트다운 <small>firm/dashboard.yaml reminders</small></h2>${tk || '<p class="empty">만료 일정 없음</p>'}</section>`;
  }

  // ---------- 개발 로그 ----------
  function devPage(){
    const V = D.devlog;
    if (!V || V.error) return `<section class="panel"><h2>개발 로그</h2>${fail(V)}</section>`;
    const tbl = t => `<h3 style="font-size:14px;margin:12px 0 6px">${esc(t.title || "")}</h3><div class="scroll"><table><thead><tr>${t.header.map(h => `<th style="text-align:left">${esc(h)}</th>`).join("")}</tr></thead>
      <tbody>${t.rows.map(r => `<tr>${r.map(c => `<td class="why" style="min-width:60px">${esc(c)}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${t.header.length}" class="muted">기록 없음</td></tr>`}</tbody></table></div>`;
    return `<section class="panel" data-w="approval"><h2>승인 대기 <small>docs/승인_대기.md · 마지막 갱신 ${esc(V.approval_updated || "–")}</small> ${kind("운영")}</h2>${(V.approval || []).map(tbl).join("") || '<p class="empty">표 없음</p>'}</section>
      <section class="panel" data-w="automerge"><h2>자동 머지·되돌리기 기록 <small>docs/자동변경_로그.md</small> ${kind("운영")}</h2>${(V.auto || []).map(tbl).join("") || '<p class="empty">표 없음</p>'}</section>`;
  }

  return {
    render(d){ D = d; shell(); },
    start(){ window.addEventListener("hashchange", () => { if (D && currentPw) { menuOpen = false; ui.courtSel = null; shell(); window.scrollTo(0, 0); } }); },
  };
})();
FolderApp.start();
</script>

let currentPw = null;
const KEY = "aisec_dash_pw";
const app = document.getElementById("app");

// ---------- 잠금 해제 ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.it, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function gate(msg){
  app.innerHTML = `<div class="gate"><form id="f">
    <h1>AI 증권사</h1><p>비밀번호를 입력하면 대시보드가 열립니다.</p>
    <input type="password" id="pw" autocomplete="current-password" aria-label="비밀번호" required>
    <label><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
    <button class="btn" type="submit">열기</button><div class="err" id="err">${msg||""}</div></form></div>`;
  const f = document.getElementById("f");
  document.getElementById("pw").focus();
  f.onsubmit = async e => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    try {
      const data = await decrypt(pw);
      currentPw = pw;
      try { document.getElementById("rem").checked ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch(_){}
      render(data);
    } catch(_) {
      // 이 브라우저·앱에서 암호 해제 기능(crypto.subtle)이 없으면 비밀번호와 상관없이 실패한다 → 이유를 나눠 알림
      document.getElementById("err").textContent = (window.crypto && crypto.subtle)
        ? "비밀번호가 맞지 않습니다. (자동 완성으로 다른 비밀번호가 들어갔는지도 확인해 주세요)"
        : "이 화면에서는 잠금 해제가 안 됩니다. 크롬·사파리·엣지 브라우저로 열어 주세요 (앱 안 미리보기·파일 뷰어는 안 됨).";
    }
  };
}
async function start(){
  if (!PAYLOAD) { app.innerHTML = '<div class="gate"><p>아직 데이터가 없습니다.</p></div>'; return; }
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(_){}
  if (saved) { try { const data = await decrypt(saved); currentPw = saved; render(data); return; } catch(_) { try{localStorage.removeItem(KEY);}catch(_){} } }
  gate();
}

// ---------- 화면 ----------
function render(d){
  // 폴더형 화면 (dashboard/folders.js, 빌드 때 끼워 넣음). 없으면 아래 예전 한 페이지 화면
  if (typeof FolderApp !== "undefined") return FolderApp.render(d);
  const P = d.performance || {}, C = d.costs || {}, R = d.runs || {};
  app.innerHTML = `<div class="wrap">
    <header class="top"><h1>AI 증권사</h1>
      <div class="meta"><span class="${stale(d.generated_utc) ? "warn" : ""}">${esc(d.generated_kst)} 기준 (${esc(ageText(d.generated_utc))})</span>
        ${d.trigger ? '<button class="refresh" id="refresh">지금 갱신</button>' : ""}<button class="linkbtn" id="lock">잠그기</button></div></header>
    <div class="status" id="status" role="status" aria-live="polite">${stale(d.generated_utc) ? "하루 넘게 갱신되지 않았습니다. 일일 업무가 실패했는지 확인해 주세요." : ""}</div>
    ${hero(P, C, R, d.gate)}
    ${depts(P)}
    <div class="grid3">${memos(d.memos, P)}${costs(C)}${events(d.events)}</div>
    ${picks(d.picks)}
    ${gatePanel(d.gate)}
    ${shadowBuysPanel(d.shadow_buys)}
    ${rehearsalPanel(d.rehearsal)}
    ${autoloopPanel(d.autoloop)}
    ${analysts(d.analysts)}
    ${field(d.field, P)}
    ${runs(R)}
    <footer>매일 아침 08:30(평일 다음 날)과 주간 회의 뒤에 자동으로 갱신됩니다. 성적은 추천 다음 날 시가에 사서 보유했다고 가정한 SPY 대비 초과수익이며, 실제 매매 결과가 아닙니다.</footer>
  </div>`;
  document.getElementById("lock").onclick = () => { currentPw = null; try{localStorage.removeItem(KEY);}catch(_){} gate("잠갔습니다."); };
  const rb = document.getElementById("refresh");
  if (rb) rb.onclick = () => refreshNow(d.trigger);
}

function hero(P, C, R, Gt){
  if (P.error) return `<section class="hero">${failed(P)}</section>`;
  const k = P.desk || {}, h = k.horizon || 10;
  const big = k.n ? `<div class="big num ${sign(k.mean)}">${pp(k.mean)}</div>
      <div class="sub">추천 ${int(k.n)}건, 승률 ${pct(k.hit)}</div>
      ${isNum(k.ret) ? `<div class="absret">추천 평균 수익률 <b class="num ${sign(k.ret)}">${spct(k.ret)}</b>
        <span class="muted">같은 기간 SPY</span> <b class="num ${sign(k.spy)}">${spct(k.spy)}</b></div>` : ""}`
    : `<div class="big faint">채점 대기</div><div class="sub">추천 후 ${h}거래일이 지나면 첫 성적이 표시됩니다.</div>`;
  const runsTot = (R.repos||[]).reduce((a,r)=>a+(r.total||0),0), ok = (R.repos||[]).reduce((a,r)=>a+(r.ok||0),0);
  const q = R.quota || 2000, used = R.minutes || 0;
  const ws = (P.depts||[]).filter(r => isNum(r.weight));
  const tot = ws.reduce((a,r)=>a+r.weight,0) || 1;
  const bar = ws.map(r => `<span style="flex-basis:${(r.weight/tot*100).toFixed(1)}%;background:${col(r.dept)}" title="${esc(r.label)}"></span>`).join("");
  const leg = ws.map(r => `<span><i style="background:${col(r.dept)}"></i>${esc(r.label)} <b class="num">${(r.weight/tot*100).toFixed(0)}%</b>
      <span class="num ${sign(r.ex10)}">${pp(r.ex10)}</span></span>`).join("");
  return `<section class="hero">
    <div class="row">
      <div><div class="label">본사 추천 성적, ${h}일 보유 기준 SPY 대비 초과수익</div>${big}</div>
      <div class="side">
        ${Gt && Gt.ready && isNum(Gt.account_ret_pct) ? `<div><span class="muted">가상 계좌 총 수익률</span><b class="num ${sign(Gt.account_ret_pct)}">${spct(Gt.account_ret_pct)}</b></div>
        <div class="faint" style="font-size:12.5px;margin-top:-6px"><span>${esc(String(Gt.start_date||"").slice(5))}부터, 같은 기간 SPY</span><span class="num">${spct(Gt.spy_ret_pct)}</span></div>` : ""}
        <div><span class="muted">이번 달 AI 비용</span><b class="num">${C.error ? "–" : usd(C.month_total)}</b></div>
        <div><span class="muted">이번 달 실행</span><b class="num">${R.error ? "–" : `${int(runsTot)}회`}${runsTot ? ` <span class="muted">성공 ${Math.round(ok/runsTot*100)}%</span>` : ""}</b></div>
        <div><span class="muted">GitHub 실행 시간</span><b class="num">${R.error ? "–" : `${int(used)} / ${int(q)}분`}</b></div>
      </div>
    </div>
    <div class="trust"><div class="cap">본사가 각 부서를 믿는 비중 (주간 개선 회의가 성적을 보고 조정), 옆 숫자는 10일 성적</div>
      <div class="bar">${bar}</div><div class="legend">${leg}</div></div>
  </section>`;
}

function depts(P){
  if (P.error) return `<section class="panel"><h2>부서 성적</h2>${failed(P)}</section>`;
  const rows = (P.depts||[]).map(r => `<tr>
    <td><span class="dot" style="background:${col(r.dept)}"></span><span class="name">${esc(r.label)}</span>
      <span class="desc dd">${esc(r.desc||DESC[r.dept]||"")}</span></td>
    <td>${int(r.n_cand)}</td>
    <td class="${r.is_stale ? "warn" : ""}">${r.last_date ? esc(r.last_date.slice(5)) : "–"}${r.is_stale ? ` (${r.stale_days}일 멈춤)` : ""}</td>
    <td class="${sign(r.ex5)}">${pp(r.ex5)}<span class="desc faint">n=${r.n5}</span></td>
    <td class="${sign(r.ex10)}">${pp(r.ex10)}<span class="desc faint">n=${r.n10}</span></td>
    <td class="${sign(r.ex20)}">${pp(r.ex20)}<span class="desc faint">n=${r.n20}</span></td>
    <td>${pct(r.hit10)}</td><td>${isNum(r.weight) ? r.weight.toFixed(1) : "–"}</td></tr>`).join("");
  return `<section class="panel"><h2>부서 성적 <small>추천 종목을 샀다면 SPY보다 얼마나 나았는지</small></h2>
    <div class="scroll"><table><thead><tr><th>부서</th><th>추천</th><th>최근 신호</th><th>5일</th><th>10일</th><th>20일</th><th>10일 승률</th><th>가중치</th></tr></thead>
    <tbody>${rows}</tbody></table></div></section>`;
}

function memos(M, P){
  if (!M || M.error) return `<section class="panel"><h2>최근 결정</h2>${failed(M)}</section>`;
  const block = (j, name) => j ? `<div class="inner"><h3>${esc(name)} <span class="faint" style="font-weight:400">${esc(j.title.replace(/ 주간.*$/,""))}</span></h3>
      <ul class="memo">${j.decisions.map(x=>`<li>${esc(x)}</li>`).join("") || "<li>기록 없음</li>"}</ul>
      ${j.ai ? `<p class="muted" style="font-size:13px;margin:8px 0 0">${esc(j.ai)}</p>` : ""}</div>`
    : `<div class="inner"><h3>${esc(name)}</h3><p class="empty">아직 회의 기록이 없습니다.</p></div>`;
  const ch = (P && P.changes || []).map(c => `<li><span class="faint num">${esc(c.date.slice(5))}</span> ${esc(c.text)}</li>`).join("");
  return `<section class="panel"><h2>최근 결정</h2>${block(M.improve, "개선 회의")}${block(M.evolve, "진화 회의")}
    ${ch ? `<div class="inner"><h3>설정 변경 이력</h3><ul class="memo">${ch}</ul></div>` : ""}</section>`;
}

function costs(C){
  if (!C || C.error) return `<section class="panel"><h2>비용</h2>${failed(C)}</section>`;
  const rows = (C.items||[]).map(i => `<div class="inner"><div style="display:flex;justify-content:space-between;gap:10px">
      <b>${esc(i.source)}</b><b class="num">${usd(i.month, 3)}</b></div>
      <span class="muted" style="font-size:13px">누적 ${usd(i.total, 3)}${isNum(i.calls) ? `, 이번 달 ${int(i.calls)}회 호출` : ""}<br>${esc(i.detail)}</span></div>`).join("");
  return `<section class="panel"><h2>이번 달 AI 비용 <small>${esc(C.month)}</small></h2>${rows}
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">GitHub 실행은 월 무료 시간 안이면 $0입니다.</p></section>`;
}

function events(E){
  if (!E || E.error) return `<section class="panel"><h2>다가오는 일정</h2>${failed(E)}</section>`;
  const rows = E.map(e => `<div class="ev"><div class="dday ${e.days <= 3 && e.kind !== "run" ? "soon" : ""}">${e.days === 0 ? "오늘" : "D-" + e.days}</div>
      <div><b>${esc(e.title)}</b><span>${esc(e.date.slice(5))}${e.time ? " " + esc(e.time) : ""}, ${esc(e.note)}</span></div></div>`).join("");
  return `<section class="panel"><h2>다가오는 일정</h2>${rows || '<p class="empty">예정된 일정이 없습니다.</p>'}</section>`;
}

function picks(K){
  if (!K || K.error) return `<section class="panel"><h2>오늘의 추천</h2>${failed(K)}</section>`;
  const desk = K.desk && K.desk.rows || [];
  const rows = desk.slice(0, 8).map(r => `<div class="pick"><span class="t">${esc(r.ticker)}</span>
      <span class="num muted">${isNum(r.score) ? r.score.toFixed(0) + "점" : ""}</span>
      <span class="r">${r.agents.length ? `<b style="color:var(--text);font-weight:500">${esc(r.agents.join(", "))}</b><br>` : ""}${esc(r.reason)}</span></div>`).join("");
  const other = (K.depts||[]).map(x => {
    const list = (x.rows||[]).slice(0, 10).map(r => esc(r.ticker)).join(", ");
    return `<div class="inner"><h3><span class="dot" style="background:${col(x.dept)}"></span>${esc(x.label||LABEL[x.dept]||x.dept)} <span class="faint" style="font-weight:400">${x.date ? esc(String(x.date).slice(5)) : ""}</span></h3>
      <span class="${list ? "" : "muted"}" style="font-size:14px">${list || "최근 매수 후보 없음"}</span></div>`;
  }).join("");
  return `<section class="panel"><h2>오늘의 추천 <small>${K.desk ? `애널리스트 데스크 ${esc(K.desk.date)}` : ""}</small></h2>
    ${rows || '<p class="empty">애널리스트 데스크 추천이 아직 없습니다. 다음 일일 업무 뒤에 표시됩니다.</p>'}
    <div class="grid-field" style="margin-top:12px">${other}</div></section>`;
}

function spark(vals){
  const v = (vals||[]).filter(isNum); if (v.length < 2) return "";
  const mn = Math.min(...v), mx = Math.max(...v), W = 300, H = 46, r = (mx - mn) || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1) * W).toFixed(1)},${(H - 4 - (x - mn) / r * (H - 8)).toFixed(1)}`).join(" ");
  const c = v[v.length - 1] >= v[0] ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}
function gatePanel(G){
  const title = `<h2>통제 게이트 <small>리스크·컴플라이언스, 섀도 모드 (주문 없음, 가상 장부)</small></h2>`;
  if (!G || G.error) return `<section class="panel">${title}${failed(G)}</section>`;
  if (!G.ready) return `<section class="panel">${title}<p class="empty">아직 게이트가 한 번도 돌지 않았습니다. 다음 일일 업무 뒤에 표시됩니다.</p></section>`;
  const ret = isNum(G.equity) ? (G.equity / G.account - 1) * 100 : null;
  const halt = G.halted ? `<div class="halt"><b>킬스위치 발동, 신규 진입 중단</b><br>${G.reasons.map(esc).join("<br>")}</div>` : "";
  const stat = `<div class="gstat">
    <div class="inner"><span class="lbl">가상 계좌</span><b class="num">$${int(Math.round(G.equity||0))}</b><span class="sub2 num ${sign(ret)}">${spct(ret)}</span>${spark(G.curve)}</div>
    <div class="inner"><span class="lbl">오늘</span><b class="num ${sign(G.day_pct)}">${spct(G.day_pct)}</b><span class="sub2 num ${sign(G.week_pct)}">이번 주 ${spct(G.week_pct)}</span></div>
    <div class="inner"><span class="lbl">고점 대비</span><b class="num ${sign(G.dd_pct)}">${spct(G.dd_pct)}</b><span class="sub2 ${G.halted ? "nobadge" : "okbadge"}">킬스위치 ${G.halted ? "발동" : "정상"}</span></div>
    <div class="inner"><span class="lbl">청산된 거래</span><b class="num">${int(G.stats.n)}건</b><span class="sub2 muted">승률 ${pct(G.stats.win)}, 평균 ${isNum(G.stats.avg_r) ? G.stats.avg_r.toFixed(2) + "R" : "–"} · 손익비 ${isNum(G.stats.payoff) ? G.stats.payoff.toFixed(2) : "–"}, PF ${isNum(G.stats.pf) ? G.stats.pf.toFixed(2) : "–"}</span></div></div>`;
  const pf = G.perf && G.perf.days ? G.perf : null, pa = pf ? pf.account||{} : {}, ps = pf ? pf.spy||{} : {};
  const pc1 = v => isNum(v) ? (v > 0 ? "+" : "") + v.toFixed(1) + "%" : "–";
  const perf = pf ? `<h3>시작 이후 성적 <span class="muted" style="font-weight:400">${esc(String(G.start_date||"").slice(5))}부터 ${int(pf.days)}거래일</span></h3>
    <div class="scroll"><table><thead><tr><th></th><th>총 수익률</th><th>CAGR(연환산)</th><th>MDD</th><th>칼마</th></tr></thead><tbody>
    <tr><td><span class="name">가상 계좌</span></td><td class="num ${sign(pa.total_ret_pct)}">${spct(pa.total_ret_pct)}</td><td class="num ${sign(pa.cagr_pct)}">${pc1(pa.cagr_pct)}</td><td class="num down">${spct(pa.mdd_pct)}</td><td class="num">${isNum(pa.calmar) ? pa.calmar.toFixed(2) : "–"}</td></tr>
    <tr><td><span class="name">SPY</span></td><td class="num ${sign(ps.total_ret_pct)}">${spct(ps.total_ret_pct)}</td><td class="num ${sign(ps.cagr_pct)}">${pc1(ps.cagr_pct)}</td><td class="num down">${spct(ps.mdd_pct)}</td><td class="num">${isNum(ps.calmar) ? ps.calmar.toFixed(2) : "–"}</td></tr>
    </tbody></table></div>${pf.cagr_short ? `<p class="faint" style="font-size:12.5px">CAGR·칼마(CAGR÷|MDD|)는 참고용입니다. 운영 ${int(pf.cagr_min_days)}거래일 전에는 며칠 성적을 1년으로 늘린 값이라 크게 흔들립니다.</p>` : ""}` : "";
  const today = (G.today||[]).map(t => { const ok = t.decision === "통과"; return `<tr>
    <td><span class="name">${esc(t.ticker)}</span><span class="desc">${esc(t.depts||"")}</span></td>
    <td class="${ok ? "up" : "down"}">${esc(t.decision)}</td>
    <td class="why">${ok ? (t.warns ? `<span class="warn">${esc(t.warns)}</span>` : "모든 규칙 통과") : esc(t.fails)}</td>
    <td>${ok ? `$${isNum(t.entry_plan) ? t.entry_plan.toFixed(2) : "–"}<span class="desc faint">손절 $${isNum(t.stop_plan) ? t.stop_plan.toFixed(2) : "–"}, 목표 $${isNum(t.target_plan) ? t.target_plan.toFixed(2) : "–"}</span>` : "–"}</td>
    <td>${ok ? `${int(t.shares_plan)}주<span class="desc faint">위험 ${usd(t.risk_usd, 0)}</span>` : "–"}</td></tr>`; }).join("");
  const live = (G.live||[]).map(p => { const pl = isNum(p.last) && isNum(p.entry) ? (p.last / p.entry - 1) * 100 : null; return `<tr>
    <td><span class="name">${esc(p.ticker)}</span><span class="desc">${esc(p.sector||"")}</span></td>
    <td class="${p.status === "open" ? "" : "warn"}">${p.status === "open" ? "보유 중" : "진입 대기"}</td>
    <td>${isNum(p.shares) ? int(p.shares) + "주" : "–"}</td>
    <td>${isNum(p.entry) ? "$" + p.entry.toFixed(2) : "–"}<span class="desc faint">${esc(String(p.entry_date||"").slice(5))}</span></td>
    <td>${isNum(p.last) ? "$" + p.last.toFixed(2) : "–"}</td>
    <td>${isNum(p.cost) ? "$" + int(Math.round(p.cost)) : "–"}</td><td>${isNum(p.value) ? "$" + int(Math.round(p.value)) : "–"}</td>
    <td class="muted">${isNum(p.stop) ? "$" + p.stop.toFixed(2) : "–"} / ${isNum(p.target) ? "$" + p.target.toFixed(2) : "–"}</td>
    <td class="${sign(pl)}">${spct(pl)}</td></tr>`; }).join("");
  const LT = G.live_total;

  const liveNote = LT && LT.no_price ? `<p class="warn" style="font-size:13px;margin:6px 0 0">현재가가 없는 종목 ${int(LT.no_price)}개는 합계에서 매수가로 평가했습니다.</p>` : "";
  const pxMiss = (G.px_missing||[]).length ? `<p class="warn" style="font-size:13px;margin:6px 0 0">⚠️ 시세를 받지 못한 종목: ${(G.px_missing||[]).map(m => `${esc(m.ticker)} (${m.asof ? esc(String(m.asof).slice(5)) + " 종가" : esc(m.basis||"직전 값")} $${isNum(m.price) ? m.price.toFixed(2) : "–"})`).join(", ")}. 직전 확정 종가로 평가했고, 다음 실행에서 시세가 오면 다시 계산합니다.</p>` : "";
  const closed = (G.closed||[]).map(c => `<tr><td><span class="name">${esc(c.ticker)}</span></td><td class="muted">${esc(String(c.exit_date||"").slice(5))}</td>
    <td>${esc(c.exit_reason||"")}</td><td class="${sign(c.r_multiple)}">${isNum(c.r_multiple) ? (c.r_multiple > 0 ? "+" : "") + c.r_multiple.toFixed(2) + "R" : "–"}</td>
    <td class="${sign(c.pnl_usd)}">${isNum(c.pnl_usd) ? (c.pnl_usd > 0 ? "+" : "−") + "$" + Math.abs(c.pnl_usd).toFixed(0) : "–"}</td></tr>`).join("");
  const why = (G.top_reasons||[]).map(([k, n]) => `<li>${esc(k)} <span class="muted num">${n}회</span></li>`).join("");
  const rg = G.regime || null;
  const rcls = !rg ? "muted" : rg.state === "block" ? "nobadge" : rg.state === "caution" ? "warn" : rg.state === "normal" ? "okbadge" : "muted";
  const regime = rg ? `<p style="margin:0 0 12px;font-size:14px"><span class="muted">시장 국면</span> <b class="${rcls}">${esc(rg.label)}</b></p>` : "";
  const dl = G.desk_lag;

      <div class="scroll" style="margin-top:8px"><table><thead><tr><th>종목</th><th>수익률</th><th>SPY 대비</th><th>청산 예정</th></tr></thead><tbody>
      ${(e.holdings||[]).map(h => `<tr><td><span class="name">${esc(h["종목"])}</span></td><td class="${sign(h["수익률%"])}">${spct(h["수익률%"])}</td>
        <td class="${sign(h["초과수익%"])}">${pp(h["초과수익%"])}</td><td class="muted">${esc(String(h["매도 예정일"]||"").slice(5))}</td></tr>`).join("") || '<tr><td colspan="4" class="muted">보유 중인 가상매수 없음</td></tr>'}
      </tbody></table></div></div>` : `<div class="inner"><h3>실적 발표 AI</h3><p class="empty">보고서를 찾지 못했습니다.</p></div>`;
  const ch = c ? `<div class="inner"><h3><span class="dot" style="background:var(--c-chart-ai)"></span>차트 AI 가상매매</h3>
      <div class="scroll"><table><tbody>
      <tr><td>건수</td><td>${int(c.n)}</td></tr><tr><td>승률</td><td>${pct(c.hit)}</td></tr>
      <tr><td>평균 수익률</td><td class="${sign(c.mean)}">${spct(c.mean)}</td></tr><tr><td>중앙값</td><td class="${sign(c.median)}">${spct(c.median)}</td></tr>
      <tr><td>SPY 대비</td><td class="${sign(c.ex)}">${pp(c.ex)}</td></tr><tr><td>최대 손실</td><td class="down">${spct(c.mdd)}</td></tr>
      </tbody></table></div></div>` : `<div class="inner"><h3>차트 AI</h3><p class="empty">성적표를 찾지 못했습니다.</p></div>`;
  const tbl = (x, key, title) => x ? `<h3 style="margin-top:4px">${title} <span class="faint" style="font-weight:400">${esc(x.date.slice(5))}</span></h3>
      <div class="scroll"><table><thead><tr><th>구분</th><th>CAGR</th><th>MaxDD</th><th>Sharpe</th></tr></thead><tbody>
      ${x.rows.map(r => `<tr><td>${esc(r[key])}</td><td class="${sign(r["CAGR(%)"])}">${spct(r["CAGR(%)"])}</td><td class="down">${spct(r["MaxDD(%)"],1)}</td><td>${isNum(r.Sharpe) ? r.Sharpe.toFixed(2) : "–"}</td></tr>`).join("")}
      </tbody></table></div>` : "";
  const sw = (s.rotation || s.backtest) ? `<div class="inner"><h3><span class="dot" style="background:var(--c-swing-lab)"></span>스크리너 백테스트</h3>
      ${tbl(s.backtest, "구분", "눌림 전략")}${tbl(s.rotation, "전략", "섹터 로테이션")}</div>`
    : `<div class="inner"><h3>스크리너</h3><p class="empty">백테스트 결과를 찾지 못했습니다.</p></div>`;
  const extra = ((P && P.depts) || []).filter(r => !r.known).map(r => `<div class="inner"><h3><span class="dot" style="background:${col(r.dept)}"></span>${esc(r.label)}</h3>
      <div class="scroll"><table><tbody>
      <tr><td>추천</td><td>${int(r.n_cand)}건</td></tr><tr><td>최근 신호</td><td>${r.last_date ? esc(r.last_date.slice(5)) : "–"}</td></tr>
      <tr><td>10일 성적</td><td class="${sign(r.ex10)}">${pp(r.ex10)}</td></tr><tr><td>10일 승률</td><td>${pct(r.hit10)}</td></tr>
      </tbody></table></div><p class="muted" style="font-size:12.5px;margin:8px 0 0">${esc(r.desc)}. 이 부서 자체 성적표는 아직 연결되지 않았습니다.</p></div>`).join("");
  return `<section class="panel"><h2>부서 현장 <small>각 부서가 자기 저장소에 기록한 성적</small></h2><div class="grid-field">${ea}${ch}${sw}${extra}</div></section>`;
}

function runs(R){
  if (!R || R.error) return `<section class="panel"><h2>실행 현황</h2>${failed(R)}</section>`;
  const q = R.quota || 2000, used = R.minutes || 0;
  const rows = (R.repos||[]).map(r => r.error ? `<tr><td><span class="name">${esc(r.label||LABEL[r.repo]||r.repo)}</span><span class="desc">${esc(r.repo)}</span></td>
      <td colspan="4" class="warn" style="text-align:left">${esc(r.error)}</td></tr>`
    : `<tr><td><span class="name">${esc(r.label||LABEL[r.repo]||r.repo)}</span><span class="desc">${esc(r.repo)}</span>
        <details><summary>워크플로 ${r.workflows.length}개</summary>${r.workflows.map(w => { const [t,c] = RESULT[w.last_result] || [w.last_result||"–",""];
          return `<div style="font-size:13px;margin-top:4px;white-space:normal">${esc(w.name)} <span class="muted">${w.count}회, 마지막 ${esc(w.last_time||"–")}</span> <span class="${c}">${esc(t)}</span></div>`; }).join("")}</details></td>
      <td>${int(r.total)}</td><td class="up">${int(r.ok)}</td><td class="${r.fail ? "down" : "faint"}">${int(r.fail)}</td><td>${int(r.minutes)}분</td></tr>`).join("");
  return `<section class="panel"><h2>실행 현황 <small>${esc(R.month||"")} 이번 달</small></h2>
    <div style="display:flex;justify-content:space-between;font-size:13px" class="muted"><span>GitHub 무료 실행 시간</span><span class="num">${int(used)} / ${int(q)}분 (추정)</span></div>
    <div class="quota"><span style="width:${Math.min(100, used/q*100).toFixed(1)}%;${used/q > .8 ? "background:var(--warn)" : ""}"></span></div>
    <div class="scroll" style="margin-top:10px"><table><thead><tr><th>저장소</th><th>실행</th><th>성공</th><th>실패</th><th>시간</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

// ---------- 지금 갱신 ----------
function ageText(iso){
  if (!iso) return "–";
  const ms = Date.now() - Date.parse(iso), h = ms / 3.6e6;
  if (h < 1) return `${Math.max(1, Math.round(ms / 6e4))}분 전`;
  if (h < 48) return `${Math.round(h)}시간 전`;
  return `${Math.round(h / 24)}일 전`;
}
const stale = iso => iso && (Date.now() - Date.parse(iso)) > 26 * 3.6e6;
const LAST = "aisec_last_trigger";
function setStatus(text, cls){ const st = document.getElementById("status"); if (st) { st.className = "status" + (cls ? " " + cls : ""); st.textContent = text; } }
async function refreshNow(t){
  const btn = document.getElementById("refresh");
  let last = 0; try { last = +(localStorage.getItem(LAST) || 0); } catch(_){}
  if (Date.now() - last < 5 * 60e3) { setStatus("몇 분 전에 이미 갱신을 요청했습니다. 끝나면 화면이 자동으로 바뀝니다."); return; }
  btn.disabled = true; setStatus("갱신을 요청하는 중입니다.");
  try {
    const r = await fetch(`https://api.github.com/repos/${t.owner}/${t.repo}/actions/workflows/${t.workflow}/dispatches`, {
      method: "POST", body: JSON.stringify({ref: t.ref}),
      headers: {Authorization: `Bearer ${t.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}});
    if (r.status !== 204) throw new Error(r.status === 401 ? "갱신 토큰이 만료됐거나 잘못됐습니다. 토큰을 새로 만들어 등록해 주세요"
      : (r.status === 403 || r.status === 404) ? "갱신 토큰에 실행 권한(Actions 읽기·쓰기)이 없습니다" : `GitHub 응답 ${r.status}`);
  } catch(e) { btn.disabled = false; setStatus(`갱신 요청 실패: ${e.message}`, "err"); return; }
  try { localStorage.setItem(LAST, String(Date.now())); } catch(_){}
  setStatus("갱신 중입니다. 보통 2~4분 걸리고, 끝나면 이 화면이 자동으로 바뀝니다.");
  poll(Date.now(), PAYLOAD.ct);
}
async function poll(started, oldCt){
  if (!currentPw) return;
  if (Date.now() - started > 9 * 60e3) {
    setStatus("아직 갱신이 끝나지 않았습니다. 몇 분 뒤 새로고침해 주세요.");
    const b = document.getElementById("refresh"); if (b) b.disabled = false; return;
  }
  await new Promise(r => setTimeout(r, 20000));
  try {
    const html = await (await fetch(`./index.html?t=${Date.now()}`, {cache: "no-store"})).text();
    const m = html.match(/let PAYLOAD = (\{.*?\});/s);
    if (m) {
      const p = JSON.parse(m[1]);
      if (p.ct !== oldCt) {
        PAYLOAD = p; render(await decrypt(currentPw));
        try { localStorage.removeItem(LAST); } catch(_){}
        setStatus("새 데이터로 바뀌었습니다.", "ok"); return;
      }
    }
  } catch(_) {}
  poll(started, oldCt);
}

start();
</script>
