<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c111d">
<title>AI 증권사 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#0c111d; --panel:#131a2a; --panel2:#182137; --line:#232d46;
  --text:#e7ebf5; --muted:#8c96ae; --faint:#5f6985; --accent:#88aaff;
  --up:#4fd18b; --down:#ff6b6b; --warn:#f3c04f;
  --c-earnings-ai:#6f8cff; --c-chart-ai:#b6c0d8; --c-swing-lab:#f0b35a; --c-analyst-desk:#52c7a3;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",system-ui,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.wrap{max-width:1180px;margin:0 auto;padding:20px 20px 48px}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .warn{color:var(--warn)} .muted{color:var(--muted)} .faint{color:var(--faint)}
a{color:var(--accent)}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* 잠금 화면 */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate form{width:min(380px,100%);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px}
.gate h1{font-size:22px;margin:0 0 6px;font-weight:700}
.gate p{margin:0 0 20px;color:var(--muted);font-size:14px}
.gate input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px}
.gate label{display:flex;gap:8px;align-items:center;margin:12px 0 18px;color:var(--muted);font-size:14px}
.gate .btn{width:100%;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#0c111d;font-weight:700;cursor:pointer}
.gate .err{color:var(--down);font-size:14px;min-height:20px;margin-top:10px}

/* 머리 */
header.top{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:18px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
header.top .meta{color:var(--muted);font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.refresh{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
.refresh:disabled{opacity:.5;cursor:default}
.status{font-size:13px;color:var(--muted);margin:-8px 0 14px;min-height:0}
.status:empty{display:none}.status.err{color:var(--down)}.status.ok{color:var(--up)}

/* 히어로 */
.hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 22px 18px;margin-bottom:16px}
.hero .row{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.hero .label{color:var(--muted);font-size:14px}
.hero .big{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 4px}
.hero .sub{color:var(--muted);font-size:13px}
.hero .absret{font-size:14px;margin-top:8px}
.hero .absret b{font-weight:650;margin-right:10px}
.hero .side{display:grid;gap:10px;min-width:240px}
.hero .side div{display:flex;justify-content:space-between;gap:18px;font-size:14px}
.hero .side b{font-weight:600}
.trust{margin-top:18px}
.trust .cap{font-size:13px;color:var(--muted);margin-bottom:8px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--panel2);gap:2px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* 패널 */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.panel h2{font-size:15px;font-weight:650;color:var(--accent);margin:0 0 12px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{color:var(--muted);font-weight:400;font-size:13px}
.grid3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px;margin-bottom:16px}
.grid3 .panel{margin:0}
.grid-field{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid3>*,.grid-field>*{min-width:0}
.inner{background:var(--panel2);border-radius:10px;padding:12px 14px}
.inner + .inner{margin-top:10px}
.inner h3{font-size:14px;margin:0 0 6px;font-weight:650}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* 표 */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{color:var(--faint);font-weight:500;font-size:12.5px;text-align:right;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;padding-left:0}
tr:last-child td{border-bottom:0}
td .name{font-weight:600}
td .desc{display:block;color:var(--muted);font-size:12.5px;white-space:normal;max-width:280px}
.chip{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--panel2);color:var(--muted);margin-left:6px}
.chip.inc{color:var(--up);background:rgba(79,209,139,.1)}
.chip.sh{color:var(--warn);background:rgba(243,192,79,.1)}
.chip.ret{color:var(--faint)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}

/* 목록 */
ul.memo{margin:0;padding-left:18px}
ul.memo li{margin:4px 0;font-size:14px}
.ev{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.dday{flex:0 0 auto;min-width:54px;text-align:center;font-size:13px;font-weight:700;padding:3px 0;border-radius:8px;background:rgba(136,170,255,.12);color:var(--accent);font-variant-numeric:tabular-nums}
.dday.soon{background:rgba(243,192,79,.14);color:var(--warn)}
.ev b{display:block;font-size:14px;font-weight:600}
.ev span{font-size:13px;color:var(--muted)}
.pick{display:grid;grid-template-columns:72px 64px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pick:last-child{border-bottom:0}
.pick .t{font-weight:700}
.pick .r{font-size:13.5px;color:var(--muted)}
.quota{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:6px 0 2px}
.quota span{display:block;height:100%;background:var(--accent)}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:4px}
footer{color:var(--faint);font-size:12.5px;margin-top:24px;line-height:1.7}
.gstat{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.gstat .inner b{display:block;font-size:18px;font-weight:700;margin-top:2px}
.gstat .inner .lbl{font-size:12.5px;color:var(--muted)}
.gstat .inner .sub2{font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px 8px;margin:4px 0 0;padding:0;list-style:none}
.chips li{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.halt{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35);color:var(--down);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.okbadge{color:var(--up)} .nobadge{color:var(--down)}
.spark{width:100%;height:46px;display:block;margin-top:6px}
/* 보유 표: 표가 넘치면 표 안에서 옆으로 밀리고, 종목 칸은 왼쪽에 고정 */
.hold{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.hold th:first-child,.hold td:first-child{position:sticky;left:0;z-index:1;background:var(--panel2);min-width:76px;max-width:120px;box-shadow:6px 0 6px -6px rgba(0,0,0,.6)}
.hold td:first-child .desc{max-width:120px;white-space:normal}
.hold tr.total td{border-top:2px solid var(--line);font-weight:700}
.why{white-space:normal;font-size:13px;color:var(--muted);text-align:left;max-width:360px;min-width:190px}
@media (max-width:900px){.gstat{grid-template-columns:repeat(2,1fr)}}

@media (max-width:900px){
  .grid3,.grid-field{grid-template-columns:1fr !important}
}
@media (max-width:560px){
  .wrap{padding:14px 12px 40px}
  .hero{padding:18px 16px 16px}
  .hero .big{font-size:36px}
  .hero .side{min-width:0;width:100%}
  .panel{padding:16px 14px}
  .pick{grid-template-columns:60px 52px 1fr}
  td .desc.dd{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .bar span{transition:flex-basis .6s ease}
}
</style>
</head>

let currentPw = null;
const KEY = "aisec_dash_pw";
const app = document.getElementById("app");

// ---------- 잠금 해제 ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(PAYLOAD.salt), iterations:PAYLOAD.it, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function gate(msg){
  app.innerHTML = `<div class="gate"><form id="f">
    <h1>AI 증권사</h1><p>비밀번호를 입력하면 대시보드가 열립니다.</p>
    <input type="password" id="pw" autocomplete="current-password" aria-label="비밀번호" required>
    <label><input type="checkbox" id="rem" checked> 이 기기에서 기억하기</label>
    <button class="btn" type="submit">열기</button><div class="err" id="err">${msg||""}</div></form></div>`;
  const f = document.getElementById("f");
  document.getElementById("pw").focus();
  f.onsubmit = async e => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    try {
      const data = await decrypt(pw);
      currentPw = pw;
      try { document.getElementById("rem").checked ? localStorage.setItem(KEY, pw) : localStorage.removeItem(KEY); } catch(_){}
      render(data);
    } catch(_) { document.getElementById("err").textContent = "비밀번호가 맞지 않습니다."; }
  };
}
async function start(){
  if (!PAYLOAD) { app.innerHTML = '<div class="gate"><p>아직 데이터가 없습니다.</p></div>'; return; }
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(_){}
  if (saved) { try { const data = await decrypt(saved); currentPw = saved; render(data); return; } catch(_) { try{localStorage.removeItem(KEY);}catch(_){} } }
  gate();
}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
const sign = v => isNum(v) ? (v > 0 ? "up" : v < 0 ? "down" : "") : "faint";
const pp = (v, d=2) => isNum(v) ? `${v > 0 ? "+" : ""}${v.toFixed(d)}%p` : "–";
const pct = (v, d=1) => isNum(v) ? `${v.toFixed(d)}%` : "–";
const spct = (v, d=2) => isNum(v) ? `${v > 0 ? "+" : ""}${v.toFixed(d)}%` : "–";
const usd = (v, d=2) => isNum(v) ? `$${v.toFixed(d)}` : "–";
const int = v => isNum(v) ? v.toLocaleString("ko-KR") : "–";
const failed = s => s && s.error ? `<p class="empty">이 구역을 불러오지 못했습니다 (${esc(s.error)}). 다음 갱신 때 다시 시도합니다.</p>` : "";

}

function hero(P, C, R, Gt){
  if (P.error) return `<section class="hero">${failed(P)}</section>`;
  const k = P.desk || {}, h = k.horizon || 10;
  const big = k.n ? `<div class="big num ${sign(k.mean)}">${pp(k.mean)}</div>
      <div class="sub">추천 ${int(k.n)}건, 승률 ${pct(k.hit)}</div>
      ${isNum(k.ret) ? `<div class="absret">추천 평균 수익률 <b class="num ${sign(k.ret)}">${spct(k.ret)}</b>
        <span class="muted">같은 기간 SPY</span> <b class="num ${sign(k.spy)}">${spct(k.spy)}</b></div>` : ""}`
    : `<div class="big faint">채점 대기</div><div class="sub">추천 후 ${h}거래일이 지나면 첫 성적이 표시됩니다.</div>`;
  const runsTot = (R.repos||[]).reduce((a,r)=>a+(r.total||0),0), ok = (R.repos||[]).reduce((a,r)=>a+(r.ok||0),0);
  const q = R.quota || 2000, used = R.minutes || 0;
  const ws = (P.depts||[]).filter(r => isNum(r.weight));
  const tot = ws.reduce((a,r)=>a+r.weight,0) || 1;
  const bar = ws.map(r => `<span style="flex-basis:${(r.weight/tot*100).toFixed(1)}%;background:${col(r.dept)}" title="${esc(r.label)}"></span>`).join("");
  const leg = ws.map(r => `<span><i style="background:${col(r.dept)}"></i>${esc(r.label)} <b class="num">${(r.weight/tot*100).toFixed(0)}%</b>
      <span class="num ${sign(r.ex10)}">${pp(r.ex10)}</span></span>`).join("");
  return `<section class="hero">
    <div class="row">
      <div><div class="label">본사 추천 성적, ${h}일 보유 기준 SPY 대비 초과수익</div>${big}</div>
      <div class="side">
        ${Gt && Gt.ready && isNum(Gt.account_ret_pct) ? `<div><span class="muted">가상 계좌 총 수익률</span><b class="num ${sign(Gt.account_ret_pct)}">${spct(Gt.account_ret_pct)}</b></div>
        <div class="faint" style="font-size:12.5px;margin-top:-6px"><span>${esc(String(Gt.start_date||"").slice(5))}부터, 같은 기간 SPY</span><span class="num">${spct(Gt.spy_ret_pct)}</span></div>` : ""}

function spark(vals){
  const v = (vals||[]).filter(isNum); if (v.length < 2) return "";
  const mn = Math.min(...v), mx = Math.max(...v), W = 300, H = 46, r = (mx - mn) || 1;
  const pts = v.map((x, i) => `${(i / (v.length - 1) * W).toFixed(1)},${(H - 4 - (x - mn) / r * (H - 8)).toFixed(1)}`).join(" ");
  const c = v[v.length - 1] >= v[0] ? "var(--up)" : "var(--down)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

  const R = A.research || {};

  const actPct = isNum(B.actions_min) && isNum(B.actions_quota) && B.actions_quota ? Math.round(B.actions_min / B.actions_quota * 100) : null;
  return `<section class="panel">${title}

      <div class="inner"><h3>승인 대기 PR</h3>${pend ? `<ul style="margin:0;padding-left:18px">${pend}</ul>` : '<p class="empty">없음</p>'}</div>
      <div class="inner"><h3>자동 개발 비용 <small class="muted">${esc(D.month||"")}, 운영비와 별도</small></h3>
        <div style="display:flex;justify-content:space-between"><span>점검관</span><b class="num">${usd(D.inspector, 2)}</b></div>

        <div style="display:flex;justify-content:space-between"><span>합계</span><b class="num">${usd(D.total, 2)}</b></div>
        <p class="muted" style="font-size:12.5px;margin:8px 0 0">월 API 전체 ${usd(B.api_total)} / 상한 ${usd(B.api_cap, 0)}${apiPct !== null ? ` (${apiPct}%)` : ""} ·
          Actions 약 ${int(B.actions_min)} / ${int(B.actions_quota)}분${actPct !== null ? ` (${actPct}%)` : ""}${(B.actions_unknown||[]).length ? `, 확인 못 함: ${esc(B.actions_unknown.join(", "))}` : ""}</p></div>
    </div>
    <div class="inner" style="margin-top:10px"><h3>연구 현황 <small class="muted">이번 달 실험 ${int(R.month_count)}/${int(R.monthly_max)}회 · 누적 실험 ${int(R.total_experiments)}회, 시험한 변형 ${int(R.total_variants)}개 · 합격 ${int(R.passed)} · 불합격 ${int(R.failed)}${R.errors ? ` · 오류 ${int(R.errors)}` : ""}</small></h3>
      ${exps ? `<div class="scroll"><table><thead><tr><th>실험</th><th>날짜</th><th>변형</th><th>결과</th><th>내용</th></tr></thead><tbody>${exps}</tbody></table></div>` : '<p class="empty">실험 기록이 없습니다.</p>'}

    <div class="inner" style="margin-top:10px"><h3>섀도 시험 중인 개선안 <small class="muted">비중 0, 실전 장부에 반영 안 됨</small></h3>${sh ? `<ul style="margin:0;padding-left:18px">${sh}</ul>` : '<p class="empty">없음</p>'}</div>
  </section>`;
}

    ${few}

    <div class="scroll"><table><thead><tr><th>애널리스트</th><th>${A.horizon}일 성적</th><th>승률</th><th>표본</th><th>투입</th></tr></thead><tbody>${rows}</tbody></table></div>

      <span class="muted" style="font-size:13px">전체 ${int(e.n_total)}건 중 성적 확정 ${int(e.n_done)}건${isNum(e.ex_mean) ? `, 평균 <span class="${sign(e.ex_mean)}">${pp(e.ex_mean)}</span>, 승률 ${pct(e.hit)}` : ""}</span>
      <div class="scroll" style="margin-top:8px"><table><thead><tr><th>종목</th><th>수익률</th><th>SPY 대비</th><th>청산 예정</th></tr></thead><tbody>

        <td class="${sign(h["초과수익%"])}">${pp(h["초과수익%"])}</td><td class="muted">${esc(String(h["매도 예정일"]||"").slice(5))}</td></tr>`).join("") || '<tr><td colspan="4" class="muted">보유 중인 가상매수 없음</td></tr>'}
      </tbody></table></div></div>` : `<div class="inner"><h3>실적 발표 AI</h3><p class="empty">보고서를 찾지 못했습니다.</p></div>`;
  const ch = c ? `<div class="inner"><h3><span class="dot" style="background:var(--c-chart-ai)"></span>차트 AI 가상매매</h3>
      <div class="scroll"><table><tbody>
      <tr><td>건수</td><td>${int(c.n)}</td></tr><tr><td>승률</td><td>${pct(c.hit)}</td></tr>
      <tr><td>평균 수익률</td><td class="${sign(c.mean)}">${spct(c.mean)}</td></tr><tr><td>중앙값</td><td class="${sign(c.median)}">${spct(c.median)}</td></tr>
      <tr><td>SPY 대비</td><td class="${sign(c.ex)}">${pp(c.ex)}</td></tr><tr><td>최대 손실</td><td class="down">${spct(c.mdd)}</td></tr>
      </tbody></table></div></div>` : `<div class="inner"><h3>차트 AI</h3><p class="empty">성적표를 찾지 못했습니다.</p></div>`;
  const tbl = (x, key, title) => x ? `<h3 style="margin-top:4px">${title} <span class="faint" style="font-weight:400">${esc(x.date.slice(5))}</span></h3>
      <div class="scroll"><table><thead><tr><th>구분</th><th>CAGR</th><th>MaxDD</th><th>Sharpe</th></tr></thead><tbody>
      ${x.rows.map(r => `<tr><td>${esc(r[key])}</td><td class="${sign(r["CAGR(%)"])}">${spct(r["CAGR(%)"])}</td><td class="down">${spct(r["MaxDD(%)"],1)}</td><td>${isNum(r.Sharpe) ? r.Sharpe.toFixed(2) : "–"}</td></tr>`).join("")}
      </tbody></table></div>` : "";
  const sw = (s.rotation || s.backtest) ? `<div class="inner"><h3><span class="dot" style="background:var(--c-swing-lab)"></span>스크리너 백테스트</h3>

    : `<div class="inner"><h3>스크리너</h3><p class="empty">백테스트 결과를 찾지 못했습니다.</p></div>`;

      <td colspan="4" class="warn" style="text-align:left">${esc(r.error)}</td></tr>`
    : `<tr><td><span class="name">${esc(r.label||LABEL[r.repo]||r.repo)}</span><span class="desc">${esc(r.repo)}</span>
        <details><summary>워크플로 ${r.workflows.length}개</summary>${r.workflows.map(w => { const [t,c] = RESULT[w.last_result] || [w.last_result||"–",""];
          return `<div style="font-size:13px;margin-top:4px;white-space:normal">${esc(w.name)} <span class="muted">${w.count}회, 마지막 ${esc(w.last_time||"–")}</span> <span class="${c}">${esc(t)}</span></div>`; }).join("")}</details></td>
      <td>${int(r.total)}</td><td class="up">${int(r.ok)}</td><td class="${r.fail ? "down" : "faint"}">${int(r.fail)}</td><td>${int(r.minutes)}분</td></tr>`).join("");
  return `<section class="panel"><h2>실행 현황 <small>${esc(R.month||"")} 이번 달</small></h2>
    <div style="display:flex;justify-content:space-between;font-size:13px" class="muted"><span>GitHub 무료 실행 시간</span><span class="num">${int(used)} / ${int(q)}분 (추정)</span></div>
    <div class="quota"><span style="width:${Math.min(100, used/q*100).toFixed(1)}%;${used/q > .8 ? "background:var(--warn)" : ""}"></span></div>
    <div class="scroll" style="margin-top:10px"><table><thead><tr><th>저장소</th><th>실행</th><th>성공</th><th>실패</th><th>시간</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
}

// ---------- 지금 갱신 ----------
function ageText(iso){
  if (!iso) return "–";
  const ms = Date.now() - Date.parse(iso), h = ms / 3.6e6;
  if (h < 1) return `${Math.max(1, Math.round(ms / 6e4))}분 전`;
  if (h < 48) return `${Math.round(h)}시간 전`;
  return `${Math.round(h / 24)}일 전`;
}
const stale = iso => iso && (Date.now() - Date.parse(iso)) > 26 * 3.6e6;
const LAST = "aisec_last_trigger";
function setStatus(text, cls){ const st = document.getElementById("status"); if (st) { st.className = "status" + (cls ? " " + cls : ""); st.textContent = text; } }
async function refreshNow(t){
  const btn = document.getElementById("refresh");
  let last = 0; try { last = +(localStorage.getItem(LAST) || 0); } catch(_){}
  if (Date.now() - last < 5 * 60e3) { setStatus("몇 분 전에 이미 갱신을 요청했습니다. 끝나면 화면이 자동으로 바뀝니다."); return; }
  btn.disabled = true; setStatus("갱신을 요청하는 중입니다.");
  try {
    const r = await fetch(`https://api.github.com/repos/${t.owner}/${t.repo}/actions/workflows/${t.workflow}/dispatches`, {
      method: "POST", body: JSON.stringify({ref: t.ref}),
      headers: {Authorization: `Bearer ${t.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}});
    if (r.status !== 204) throw new Error(r.status === 401 ? "갱신 토큰이 만료됐거나 잘못됐습니다. 토큰을 새로 만들어 등록해 주세요"
      : (r.status === 403 || r.status === 404) ? "갱신 토큰에 실행 권한(Actions 읽기·쓰기)이 없습니다" : `GitHub 응답 ${r.status}`);
  } catch(e) { btn.disabled = false; setStatus(`갱신 요청 실패: ${e.message}`, "err"); return; }
  try { localStorage.setItem(LAST, String(Date.now())); } catch(_){}
  setStatus("갱신 중입니다. 보통 2~4분 걸리고, 끝나면 이 화면이 자동으로 바뀝니다.");
  poll(Date.now(), PAYLOAD.ct);
}
async function poll(started, oldCt){
  if (!currentPw) return;
  if (Date.now() - started > 9 * 60e3) {
    setStatus("아직 갱신이 끝나지 않았습니다. 몇 분 뒤 새로고침해 주세요.");
    const b = document.getElementById("refresh"); if (b) b.disabled = false; return;
  }
  await new Promise(r => setTimeout(r, 20000));
  try {
    const html = await (await fetch(`./index.html?t=${Date.now()}`, {cache: "no-store"})).text();
    const m = html.match(/let PAYLOAD = (\{.*?\});/s);
    if (m) {
      const p = JSON.parse(m[1]);
      if (p.ct !== oldCt) {
        PAYLOAD = p; render(await decrypt(currentPw));
        try { localStorage.removeItem(LAST); } catch(_){}
        setStatus("새 데이터로 바뀌었습니다.", "ok"); return;
      }
    }
  } catch(_) {}
  poll(started, oldCt);
}

start();
